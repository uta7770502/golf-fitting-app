<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Fitting | MY GOLF GARAGE</title><style>:root{--bg:#090c0a;--card:#141a16;--line:#29342c;--g:#b9ff4f;--mut:#94a197;--w:#f7f9f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;padding:24px 18px 80px}.eye{font-size:10px;letter-spacing:.18em;color:var(--g);font-weight:800}h1{font-size:29px;margin:6px 0}h2{font-size:16px}.mut{color:var(--mut);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}.label{font-size:11px;color:var(--mut);margin:13px 0 5px}input,select{width:100%;background:#0d120f;color:var(--w);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}.row{display:grid;grid-template-columns:1fr 100px;gap:8px}.btn{width:100%;border:0;border-radius:14px;background:var(--g);color:#111;padding:15px;font-weight:800;margin-top:16px}.back{color:var(--g);text-decoration:none;font-size:13px}.score{font-size:32px;font-weight:800}.tag{display:inline-block;border:1px solid #445348;border-radius:20px;padding:5px 8px;font-size:10px;color:var(--g);margin:2px}.result{border-left:3px solid var(--g);padding-left:14px}.warn{color:#ffd56a}.good{color:var(--g)}ul{padding-left:20px}li{margin:8px 0;font-size:13px}</style></head><body><main class="app"><a class="back" href="./">← MY GOLF GARAGE</a><div class="eye" style="margin-top:20px">PING-INSPIRED DRIVER FITTING · BETA</div><h1>DRIVER FITTING</h1><div class="mut">取得できる数値だけ入力してください。不明項目は空欄のままで判定します。</div><div class="card"><h2>現在のクラブ</h2><div class="label">PINGヘッドタイプ（他メーカーの場合は近い特性）</div><select id="head"><option value="MAX">MAX / ニュートラル・寛容性</option><option value="LST">LST / 低スピン</option><option value="SFT">SFT / ドローバイアス</option><option value="HL">HL / 軽量・高打ち出し</option><option value="OTHER">その他</option></select><div class="label">ロフト</div><select id="loft"><option>8°</option><option>9°</option><option selected>10.5°</option><option>12°</option><option>不明</option></select><div class="label">現在のシャフト</div><input id="shaft" placeholder="例：VENTUS BLACK 6S"></div><div class="card"><h2>Launch Monitor</h2><div class="label">Ball Speed</div><div class="row"><input id="bs" inputmode="decimal"><select id="speedUnit"><option value="ms">m/s</option><option value="mph">mph</option></select></div><div class="label">Club Speed</div><div class="row"><input id="cs" inputmode="decimal"><select id="clubUnit"><option value="ms">m/s</option><option value="mph">mph</option></select></div><div class="label">Launch Angle °</div><input id="launch" inputmode="decimal"><div class="label">Spin Rate rpm</div><input id="spin" inputmode="numeric"><div class="label">Carry yd</div><input id="carry" inputmode="decimal"><div class="label">Attack Angle °</div><input id="aoa" inputmode="decimal"><div class="label">Peak Height yd</div><input id="height" inputmode="decimal"><div class="label">Descent Angle °</div><input id="descent" inputmode="decimal"><div class="label">打点</div><select id="impact"><option value="">不明</option><option value="center">センター</option><option value="high">上</option><option value="low">下</option><option value="heel">ヒール</option><option value="toe">トゥ</option></select><div class="label">主なミス方向</div><select id="miss"><option value="">不明</option><option value="right">右 / スライス・プッシュ</option><option value="left">左 / フック・プル</option><option value="mixed">左右両方</option><option value="straight">概ねストレート</option></select><div class="label">測定球数</div><input id="shots" inputmode="numeric" placeholder="例：5"></div><button class="btn" onclick="fit()">フィッティング判定</button><div id="out"></div></main><script>const $=id=>document.getElementById(id);const num=id=>{let v=parseFloat($(id).value);return Number.isFinite(v)?v:null};function mph(v,u){if(v==null)return null;return u==='ms'?v*2.23694:v}function fit(){let bs=mph(num('bs'),$('speedUnit').value),cs=mph(num('cs'),$('clubUnit').value),la=num('launch'),sp=num('spin'),ca=num('carry'),aoa=num('aoa'),ht=num('height'),da=num('descent'),shots=num('shots'),impact=$('impact').value,miss=$('miss').value,current=$('head').value;let vals=[bs,cs,la,sp,ca,aoa,ht,da].filter(v=>v!=null).length+(impact?1:0)+(miss?1:0);let confidence=vals<=3?'LOW':vals<=6?'MEDIUM':'HIGH';if(!shots||shots<3)confidence='LOW';let head='MAX',why=[],tests=[],shaft=[];if(miss==='right'){head='SFT';why.push('右ミス傾向があるため、ドローバイアス方向を比較候補にします。')}else if(miss==='left'){head='LST';why.push('左側のミスを抑える方向として、低スピン・操作性側を比較候補にします。')}else if(cs!=null&&cs<85){head='HL';why.push('クラブスピードから、軽量化と打ち出し確保を比較する価値があります。')}else if(sp!=null&&sp>3000&&impact!=='low'&&impact!=='heel'){head='LST';why.push('打点要因が強くない前提でスピン量が多く、低スピン側ヘッドを比較候補にします。')}else{head='MAX';why.push('まず寛容性の高いニュートラル基準ヘッドから比較します。')}if(impact==='low'||impact==='heel')why.push('低打点/ヒール打点はスピンや初速を歪めるため、ヘッド変更より先に打点再現性を確認します。');if(la!=null&&la<10){tests.push('ロフトを現在より増やす設定を1段階だけ試す。');shaft.push('高打ち出し寄りの候補も比較。')}else if(la!=null&&la>17){tests.push('ロフトを1段階下げた設定を比較する。');shaft.push('中〜低打ち出し寄りを比較。')}if(sp!=null&&sp>3000)tests.push('同じ打点条件で低スピン側ヘッド/設定を5球比較。');if(sp!=null&&sp<1700)tests.push('低スピン過多の可能性。ロフト増またはよりスピンを確保できる設定を比較。');if(cs!=null){if(cs<85)shaft.push('軽量帯＋R〜SR相当を起点。ただしFlexはテンポ/打点/弾道で決定。');else if(cs<100)shaft.push('50〜60g台を中心に複数Flexを比較。');else if(cs<110)shaft.push('60g台中心、必要なら70g台も比較。');else shaft.push('60〜70g台のS/X/TX領域を候補にするが、硬さはスピードだけで確定しない。')}if(!tests.length)tests.push('推奨ヘッドと現在ヘッドを同一ロフト・同一シャフトで各5球比較する。');let smash=(bs&&cs)?(bs/cs).toFixed(2):null;let html=`<div class="card result"><div class="eye">FITTING RESULT</div><div class="score">${head}</div><div><span class="tag">CONFIDENCE ${confidence}</span>${smash?`<span class="tag">SMASH ${smash}</span>`:''}<span class="tag">${vals} DATA FIELDS</span></div><h2>判定理由</h2><ul>${why.map(x=>`<li>${x}</li>`).join('')}</ul><h2>シャフト方向性</h2><ul>${shaft.length?shaft.map(x=>`<li>${x}</li>`).join(''):'<li>スピード情報がないため、重量/Flexはまだ絞り込みません。</li>'}</ul><h2>NEXT TEST</h2><ul>${tests.map(x=>`<li>${x}</li>`).join('')}</ul><p class="mut">この結果は候補を絞るための一次判定です。単発の数値だけで確定せず、同条件の複数球比較を前提にします。</p></div>`;$('out').innerHTML=html;scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}</script></body></html>
