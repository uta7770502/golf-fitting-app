<a class="listBtn" href="./">クラブ一覧・編集へ</a></main><input id="detailHeadPhotoInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="detailPhotoPicked(event,'head')"><input id="detailShaftPhotoInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="detailPhotoPicked(event,'shaft')"><div id="apiPicker" class="apiPicker" onclick="if(event.target===this)closeApiPicker()"><div class="apiSheet"><div class="sheetTop"><div><div class="kicker">商品画像候補</div><h2>API画像を選択</h2></div><button class="apiClose" onclick="closeApiPicker()">閉じる</button></div><div id="apiStatus" class="apiStatus"></div><div id="apiGrid" class="apiGrid"></div></div></div><div id="detail" class="detail" onclick="if(event.target===this)closeDetail()"><div class="sheet"><div class="sheetTop"><div><div class="kicker">クラブ詳細スペック</div><h2 id="detailTitle"></h2></div><button class="close" onclick="closeDetail()">×</button></div><div id="detailPhotos" class="detailPhotos"></div><div id="specContent"></div></div></div><script>const seed=[{category:'ドライバー',brand:'PING',year:'2025',model:'G440 LST',spec:'10.5°',shaft:'Fujikura 24 VENTUS BLACK 6S',shaftBrand:'Fujikura',shaftModel:'24 VENTUS BLACK',shaftSpec:'6S',status:'MAIN'}];const HEAD_PHOTOS=[],SHAFT_PHOTOS=[];const HEAD_DB=[{test:/PING.*G440\s*LST/i,year:'2025',weight:203,lofts:'9° / 10.5°',length:45.25}];let assembly={gripWeightsG:[25,30,35,40,45,50,55,60,65,70,75,80],components:{adapter:{driver:8,fairway:8,hybrid:8,iron:0,wedge:0,putter:0},assemblyAllowanceG:{driver:2,fairway:2,hybrid:2,iron:2,wedge:2,putter:2}},defaultLengthsIn:{driver:45.25,fairway3:43,fairway5:42.5,hybrid:40.25,iron7:37,wedge:35.5,putter:34}},special={},mainstream={};let all=[],main=[],activeIndex=-1,calcBase=0,activeMeasuredTotal=0,activeGripAtOpen=50;const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function loadLocal(){try{all=JSON.parse(localStorage.getItem('golfClubs')||'null')||seed}catch(e){all=seed}main=sortBag(all.filter(c=>c.status==='MAIN')).slice(0,14)}loadLocal();window.addEventListener('storage',e=>{if(e.key==='golfClubs'){loadLocal();render()}});window.addEventListener('pageshow',()=>{loadLocal();render()});function find(db,text){return db.find(v=>v.test.test(text))||{}}function photo(db,text){return find(db,text).url||''}function img(url,alt){return url?`<img src="${esc(url)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="missing" style="display:none">写真準備中</span>`:`<span class="missing">写真準備中</span>`}function shaftText(c){return c.shaft||[c.shaftBrand,c.shaftModel,c.shaftSpec].filter(Boolean).join(' ')}function shortShaft(c){return shaftText(c).replace(/Fujikura|Graphite Design|Mitsubishi Chemical|Nippon Shaft|UST Mamiya/ig,'').trim()}function catKey(c){let x=c.category||'';if(/ドライバー/.test(x))return'driver';if(/フェアウェイ|FW/.test(x))return'fairway';if(/ユーティリティ|HY/.test(x))return'hybrid';if(/アイアン/.test(x))return'iron';if(/ウェッジ/.test(x))return'wedge';if(/パター/.test(x))return'putter';return'driver'}function numberFromText(v){let m=String(v||'').match(/(\d+(?:\.\d+)?)/);return m?Number(m[1]):999}function clubOrder(c){let k=catKey(c),rank={driver:0,putter:1,fairway:2,hybrid:3,iron:4,wedge:5}[k]??9,sub=999,txt=String(c.spec||'').toUpperCase();if(k==='driver')sub=0;else if(k==='fairway'){let m=txt.match(/(\d+)W/);sub=m?Number(m[1]):numberFromText(txt)}else if(k==='hybrid'){let m=txt.match(/(?:U|H)(\d+)/);sub=m?Number(m[1]):numberFromText(txt)}else if(k==='iron'){let map={PW:10,AW:11,GW:12,SW:13,LW:14};if(map[txt]!=null)sub=map[txt];else sub=numberFromText(txt)}else if(k==='wedge'){let m=txt.match(/(\d+(?:\.\d+)?)\s*°/);sub=m?Number(m[1]):numberFromText(txt)}else if(k==='putter')sub=0;return rank*1000+sub}function sortBag(list){return [...list].sort((a,b)=>{let ap=Number(a.bagPosition)||999,bp=Number(b.bagPosi cKey)return {year:entry.year,kick:entry.kick};return {...entry.specs[specKey],year:entry.year,kick:entry.kick,name:`${brandKey} ${modelKey} ${specKey}`}}function shaftData(c){return specialtySpec(c)||mainstreamSpec(c)||{}}function tileClass(c){return 'cat-'+catKey(c)}function tileLabel(c){let k=catKey(c),sp=String(c.spec||'').replace(/inch/ig,'″');if(k==='driver')return'DR';if(k==='fairway')return sp&&sp!=='不明'?sp:'FW';if(k==='hybrid')return sp&&sp!=='不明'?sp:'UT';if(k==='iron')return sp&&sp!=='不明'?sp:'IRON';if(k==='wedge')return sp&&sp!=='不明'?sp:'WG';if(k==='putter')return'PT';return'#'}function tileImage(c){return c.userHeadPhoto||c.apiHeadPhoto||''}function render(){document.getElementById('count').textContent=`${main.length} / 14本`;let h='';for(let i=0;i<14;i++){let c=main[i];if(c){let hp=tileImage(c),label=tileLabel(c);h+=`<article class="clubTile ${tileClass(c)}" onclick="openDetail(${i})">${hp?`<img src="${esc(hp)}" alt="${esc((c.brand||'')+' '+(c.model||''))}">`:`<div class="tileFallback">${esc(c.brand||'')}<br>${esc(c.model||'')}</div>`}<span class="tileSpec">${esc(label)}</span><span class="tileNo">#${i+1}</span></article>`}else if(i===main.length){h+=`<a class="addTile" href="./?add=1">＋追加</a>`}else{h+=`<div class="emptyTile">＋</div>`}}document.getElementById('bagGrid').innerHTML=h}function box(l,v,e=''){return `<div class="specBox"><div class="label">${l}</div><div class="value">${esc(v===0?'0':v||'データ準備中')}</div>${e?`<div class="estimate">${e}</div>`:''}</div>`}function gripOptions(sel){return assembly.gripWeightsG.map(g=>`<option value="${g}" ${g===sel?'selected':''}>${g}g</option>`).join('')}function updateGrip(v){let g=Number(v),c=activeIndex>=0?main[activeIndex]:null,total=activeMeasuredTotal?Math.round(activeMeasuredTotal+(g-activeGripAtOpen)):(calcBase?Math.round(calcBase+g):null);document.getElementById('totalWeight').textContent=total?total+'g':'—';let src=document.getElementById('totalWeightSource');if(src)src.textContent=activeMeasuredTotal?'実測
