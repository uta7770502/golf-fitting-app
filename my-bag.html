<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マイバッグ | マイゴルフガレージ</title><style>:root{--bg:#090c0a;--card:#121814;--line:#29342c;--g:#b9ff4f;--mut:#94a197;--w:#f7f9f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;padding:20px 16px 90px}.back{color:var(--g);text-decoration:none;font-size:13px}.eye{margin-top:18px;font-size:10px;letter-spacing:.14em;color:var(--g);font-weight:800}h1{font-size:34px;margin:5px 0}.mut{color:var(--mut);font-size:12px}.summary{display:flex;justify-content:space-between;align-items:end;margin:20px 0 12px}.summary h2{margin:0;font-size:18px}.count{color:var(--g);font-size:12px;font-weight:800}.filters{display:flex;gap:7px;overflow:auto;margin-bottom:14px;scrollbar-width:none}.filter{white-space:nowrap;border:1px solid var(--line);background:#111713;color:#9ba69e;border-radius:20px;padding:8px 12px;font-size:11px}.filter.on{background:var(--g);color:#111;border-color:var(--g);font-weight:800}.cards{display:grid;grid-template-columns:1fr;gap:14px}.card{position:relative;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,#182019,#0e130f);padding:12px;overflow:hidden}.clubNo{position:absolute;right:18px;top:18px;z-index:4;background:#090c0ad9;border:1px solid #ffffff1a;border-radius:12px;padding:5px 8px;font-size:10px}.photo{height:235px;background:#f4f4f1;border-radius:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.photo.shaftPhoto{margin-top:9px;height:145px}.photo img{width:100%;height:100%;object-fit:contain;display:block}.photoLabel{position:absolute;left:8px;bottom:7px;z-index:3;background:#090c0ae8;color:#fff;border-radius:9px;padding:5px 7px;font-size:8px;font-weight:900;letter-spacing:.06em}.photoMissing{color:#657168;font-size:11px;text-align:center;padding:18px}.info{padding:12px 3px 4px}.category{font-size:10px;color:var(--g);font-weight:900}.model{font-size:20px;font-weight:900;line-height:1.15;margin-top:5px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #344139;border-radius:12px;padding:5px 8px;font-size:10px;color:#dfe5e1}.shaftName{font-size:12px;color:#b8c1ba;line-height:1.4;margin-top:9px}.emptyCard{height:92px;border:1px dashed #263129;border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#526057;font-size:11px}.emptyCard b{color:#3e4a42;font-size:18px}.add{display:block;margin:16px 0 0;text-align:center;background:var(--g);color:#111;text-decoration:none;font-weight:850;padding:14px;border-radius:14px}.note{text-align:center;color:var(--mut);font-size:10px;margin:12px 0 0}</style></head><body><main class="app"><a class="back" href="./">← ホーム</a><div class="eye">現在のセッティング</div><h1>マイバッグ</h1><div class="mut">ヘッド写真＋シャフト写真。自分の14本をそのままコレクション。</div><div class="summary"><h2>主力クラブ</h2><span id="count" class="count"></span></div><div id="filters" class="filters"></div><div id="cards" class="cards"></div><div class="note">写真データは対応モデルから順次拡張します</div><a class="add" href="./?add=1">＋ クラブを追加</a></main><script>const seed=[{category:'ドライバー',brand:'PING',year:'2025',model:'G440 LST',spec:'10.5°',loft:'10.5°',shaft:'Fujikura VENTUS BLACK (VeloCore+) 6S',status:'MAIN'}];const HEAD_PHOTOS=[{test:/PING.*G440\s*LST/i,url:'https://i.gimg.jp/cmsimg/377152.jpg?scale=both&w=1200'}];const SHAFT_PHOTOS=[{test:/VENTUS.*BLACK/i,url:'https://www.2ndswing.com/media/wysiwyg/black.png'}];let all=[];try{all=JSON.parse(localStorage.getItem('golfClubs')||'null')||seed}catch(e){all=seed}let main=all.filter(c=>c.status==='MAIN').slice(0,14),active='すべて';const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function type(c){let s=((c.category||'')+' '+(c.model||'')+' '+(c.spec||'')).toLowerCase();if(/driver|ドライバー|g4[0-9]{2}.*(lst|max|sft|k)|qi[0-9]*.*driver|quantum.*(max|diamond)/i.test(s))return'driver';if(/fairway|フェアウェイ|\bfw\b|3w|5w|7w|utility|hybrid|ユーティリティ|\bhy\b/i.test(s))return'wood';if(/putter|パター|anser|newport|spider|df3|mezz|oz\.1/i.test(s))return'putter';if(/wedge|ウェッジ/i.test(s))return'wedge';return'iron'}function group(c){return({driver:'ドライバー',wood:'FW・UT',iron:'アイアン',wedge:'ウェッジ',putter:'パター'})[type(c)]}function groups(){let a=['すべて'];main.forEach(c=>{let g=group(c);if(!a.includes(g))a.push(g)});return a}function photo(list,text){let x=list.find(v=>v.test.test(text));return x?x.url:''}function imgBox(label,url,alt,shaft=false){return `<div class="photo ${shaft?'shaftPhoto':''}"><span class="photoLabel">${label}</span>${url?`<img src="${esc(url)}" alt="${esc(alt)}" loading="eager" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="photoMissing" style="display:none">${label}写真を準備中</div>`:`<div class="photoMissing">${label}写真を準備中</div>`}</div>`}function setFilter(g){active=g;render()}function render(){document.getElementById('count').textContent=`${main.length} / 14本`;document.getElementById('filters').innerHTML=groups().map(g=>`<button class="filter ${active===g?'on':''}" onclick="setFilter('${g}')">${g}</button>`).join('');let shown=active==='すべて'?main:main.filter(c=>group(c)===active);let html=shown.map(c=>{let hp=photo(HEAD_PHOTOS,(c.brand||'')+' '+(c.model||'')),sp=photo(SHAFT_PHOTOS,c.shaft||''),spec=c.loft||c.spec||'';return `<article class="card"><span class="clubNo">#${main.indexOf(c)+1}</span>${imgBox('ヘッド',hp,(c.brand||'')+' '+(c.model||''))}${imgBox('シャフト',sp,c.shaft||'',true)}<div class="info"><div class="category">${esc(group(c))}</div><div class="model">${esc(c.brand)} ${esc(c.model)}</div><div class="meta">${c.year?`<span class="pill">${esc(c.year)}年</span>`:''}${spec?`<span class="pill">${esc(spec)}</span>`:''}</div><div class="shaftName">${esc(c.shaft||'シャフト未登録')}</div></div></article>`}).join('');if(active==='すべて')for(let i=main.length;i<14;i++)html+=`<div class="emptyCard"><span>SLOT ${i+1}</span><b>＋</b></div>`;document.getElementById('cards').innerHTML=html||'<div class="emptyCard"><span>クラブを登録してください</span><b>＋</b></div>'}render();</script></body></html>
