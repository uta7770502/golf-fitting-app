<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マイバッグ | マイゴルフガレージ</title><style>:root{--bg:#090c0a;--card:#141a16;--line:#29342c;--g:#b9ff4f;--mut:#94a197;--w:#f7f9f7}*{box-sizing:border-box}body{margin:0;background:#090c0a;color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;padding:20px 16px 92px}.back{color:var(--g);text-decoration:none;font-size:13px}.eye{margin-top:18px;font-size:10px;letter-spacing:.14em;color:var(--g);font-weight:800}h1{font-size:34px;margin:5px 0}.mut{color:var(--mut);font-size:12px}.collection{margin:18px 0 8px;padding:17px 12px 14px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,#151d17,#0d120f)}.collectionTop{display:flex;justify-content:space-between;align-items:center;margin:0 4px 12px}.collectionTop b{font-size:12px}.count{font-size:11px;color:var(--g)}.slots{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;min-height:230px;align-items:end}.slot{height:220px;position:relative;border-radius:13px;background:linear-gradient(180deg,#0d120f,#171e19);border:1px solid #253128;overflow:hidden;cursor:pointer}.slot.emptySlot{opacity:.45}.slotNo{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:8px;color:#657168}.club{position:absolute;left:50%;bottom:23px;width:36px;height:184px;transform:translateX(-50%)}.shaft{position:absolute;left:17px;bottom:0;width:3px;height:139px;background:linear-gradient(90deg,#3d4740,#d0d6d2,#4a554d);border-radius:3px}.head{position:absolute;top:0;left:3px;width:31px;height:42px;border:1px solid #79857d;background:#303a33;filter:drop-shadow(0 3px 3px #0008)}.driver .head{width:46px;height:42px;left:-5px;border-radius:50% 48% 42% 50%;background:linear-gradient(145deg,#070908,#3b453e)}.wood .head{width:40px;height:36px;left:-2px;border-radius:48%;background:#28322b}.iron .head,.wedge .head{width:29px;height:43px;left:5px;border-radius:4px;transform:skew(-8deg);background:linear-gradient(135deg,#e0e5e1,#6d7770)}.putter .head{width:44px;height:15px;left:-4px;top:25px;border-radius:4px;background:#aeb7b1}.head:after{content:attr(data-mark);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:5px;font-weight:900;color:#e6ebe7}.iron .head:after,.wedge .head:after,.putter .head:after{color:#252b27}.specTag{position:absolute;left:50%;top:45px;transform:translateX(-50%);font-size:6px;white-space:nowrap;background:#080b09;border:1px solid #354238;border-radius:8px;padding:2px 3px}.rack{height:17px;margin:9px 4px 0;border-radius:7px;background:linear-gradient(#3d4941,#1b231e);box-shadow:0 8px 15px #0009}.hint{text-align:center;color:var(--mut);font-size:10px;margin:8px 0 20px}.sectionTitle{display:flex;align-items:end;justify-content:space-between;margin:22px 2px 10px}.sectionTitle h2{font-size:19px;margin:0}.sectionTitle b{color:var(--g)}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.filter{white-space:nowrap;border:1px solid var(--line);background:#111713;color:#9ba69e;border-radius:20px;padding:8px 12px;font-size:11px}.filter.on{background:var(--g);color:#111;border-color:var(--g);font-weight:800}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{min-height:162px;background:linear-gradient(145deg,#171e19,#101511);border:1px solid var(--line);border-radius:18px;padding:13px}.minihead{height:64px;display:flex;align-items:center;justify-content:center}.mini{position:relative;width:52px;height:52px;border:2px solid #748078;background:linear-gradient(145deg,#111,#343d37);border-radius:45%}.mini.iron,.mini.wedge{width:38px;height:53px;border-radius:5px;background:linear-gradient(135deg,#e2e6e3,#747d77)}.mini.putter{width:58px;height:19px;border-radius:4px;background:#aeb6b0}.mini:after{content:attr(data-mark);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900}.card .cat{font-size:9px;color:var(--g);font-weight:800}.card b{display:block;font-size:13px;margin-top:4px}.card .spec{font-size:11px;color:#d0d6d2;margin-top:4px}.card .shaftname{font-size:9px;color:var(--mut);margin-top:5px;line-height:1.3}.empty{text-align:center;padding:45px 15px;color:var(--mut)}.add{display:block;margin:14px 0 0;text-align:center;background:var(--g);color:#111;text-decoration:none;font-weight:800;padding:13px;border-radius:14px}@media(max-width:390px){.slots{gap:4px}.collection{padding-left:8px;padding-right:8px}.slot{border-radius:10px}}</style></head><body><main class="app"><a class="back" href="./">← ホーム</a><div class="eye">現在のセッティング</div><h1>マイバッグ</h1><div class="mut">今の主力14本を、ひとつのコレクションとして。</div><div class="collection"><div class="collectionTop"><b>MY 14 CLUBS</b><span id="count" class="count"></span></div><div id="slots" class="slots"></div><div class="rack"></div></div><div class="hint">14本が揃うほど、自分だけのクラブコレクションが完成します</div><div class="sectionTitle"><h2>クラブ一覧 <b id="listCount"></b></h2></div><div id="filters" class="filters"></div><div id="cards" class="cards"></div><a class="add" href="./?add=1">＋ クラブを追加</a></main><script>const seed=[{category:'ドライバー',brand:'PING',year:'2025',model:'G440 LST',spec:'10.5°',shaft:'Fujikura 24 VENTUS BLACK 6S',status:'MAIN'}];let all=[];try{all=JSON.parse(localStorage.getItem('golfClubs')||'null')||seed}catch(e){all=seed}let main=all.filter(c=>c.status==='MAIN').slice(0,14),active='すべて';const type=c=>{let s=(c.category||'').toLowerCase();if(s.includes('ドライバー'))return'driver';if(s.includes('フェアウェイ')||s.includes('ユーティリティ')||s.includes('hy'))return'wood';if(s.includes('パター'))return'putter';if(s.includes('ウェッジ'))return'wedge';return'iron'};const mark=c=>{let b=(c.brand||'').toUpperCase();if(b.includes('PING'))return'PING';if(b.includes('TITLEIST'))return'T';if(b.includes('CALLAWAY'))return'C';if(b.includes('TAYLOR'))return'TM';if(b.includes('LAB')||b.includes('L.A.B'))return'LAB';return(c.brand||'CLUB').slice(0,4).toUpperCase()};function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function group(c){let t=type(c);return t==='driver'?'ドライバー':t==='wood'?'FW・UT':t==='iron'?'アイアン':t==='wedge'?'ウェッジ':'パター'}function draw(){document.getElementById('count').textContent=`${main.length} / 14本`;let html='';for(let i=0;i<14;i++){let c=main[i];html+=c?`<div class="slot" onclick="focusClub(${i})"><div class="club ${type(c)}"><div class="shaft"></div><div class="head" data-mark="${esc(mark(c))}"></div><div class="specTag">${esc(c.spec||group(c))}</div></div><div class="slotNo">${i+1}</div></div>`:`<div class="slot emptySlot"><div class="slotNo">${i+1}</div></div>`}document.getElementById('slots').innerHTML=html}function groups(){let arr=['すべて'];main.forEach(c=>{let g=group(c);if(!arr.includes(g))arr.push(g)});return arr}function renderCards(){document.getElementById('listCount').textContent=`${main.length}本`;document.getElementById('filters').innerHTML=groups().map(g=>`<button class="filter ${active===g?'on':''}" onclick="setFilter('${g}')">${g}${g==='すべて'?` (${main.length})`:` (${main.filter(c=>group(c)===g).length})`}</button>`).join('');let shown=active==='すべて'?main:main.filter(c=>group(c)===active);document.getElementById('cards').innerHTML=shown.map(c=>`<div class="card"><div class="minihead"><div class="mini ${type(c)}" data-mark="${esc(mark(c))}"></div></div><div class="cat">${esc(group(c))}</div><b>${esc(c.brand)} ${esc(c.model)}</b><div class="spec">${esc(c.spec||'スペック未登録')}</div><div class="shaftname">${esc(c.shaft||'シャフト未登録')}</div></div>`).join('')||'<div class="empty">該当するクラブはありません</div>'}function setFilter(g){active=g;renderCards()}function focusClub(i){active=group(main[i]);renderCards();document.querySelector('.sectionTitle').scrollIntoView({behavior:'smooth',block:'start'})}draw();renderCards();</script></body></html>
