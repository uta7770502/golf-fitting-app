<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マイバッグ | マイゴルフガレージ</title><style>:root{--bg:#090c0a;--card:#141a16;--line:#29342c;--g:#b9ff4f;--mut:#94a197;--w:#f7f9f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;padding:20px 16px 90px}.back{color:var(--g);text-decoration:none;font-size:13px}.eye{margin-top:18px;font-size:10px;letter-spacing:.14em;color:var(--g);font-weight:800}h1{font-size:34px;margin:5px 0}.mut{color:var(--mut);font-size:12px}.summary{display:flex;justify-content:space-between;align-items:end;margin:20px 0 12px}.summary h2{margin:0;font-size:18px}.count{color:var(--g);font-size:12px;font-weight:800}.filters{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.filter{white-space:nowrap;border:1px solid var(--line);background:#111713;color:#9ba69e;border-radius:20px;padding:8px 12px;font-size:11px}.filter.on{background:var(--g);color:#111;border-color:var(--g);font-weight:800}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{position:relative;border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,#182019,#0e130f);padding:10px;overflow:hidden}.clubNo{position:absolute;right:16px;top:16px;z-index:3;background:#090c0acc;border-radius:12px;padding:4px 7px;font-size:9px}.photo{height:150px;background:#f3f3f1;border-radius:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.photo+.photo{margin-top:7px;height:120px}.photo img{width:100%;height:100%;object-fit:contain;display:block}.photoLabel{position:absolute;left:7px;bottom:6px;z-index:2;background:#090c0ad9;color:#fff;border-radius:8px;padding:4px 6px;font-size:7px;font-weight:800}.photoMissing{color:#657168;font-size:9px;text-align:center;padding:12px}.category{font-size:9px;color:var(--g);font-weight:900;margin-top:11px}.model{font-size:14px;font-weight:850;line-height:1.15;margin-top:5px}.spec{font-size:11px;color:#e1e6e2;margin-top:5px}.shaftName{font-size:10px;color:var(--mut);line-height:1.35;margin-top:7px}.emptyCard{min-height:405px;border:1px dashed #263129;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#526057;font-size:11px}.add{display:block;margin:16px 0 0;text-align:center;background:var(--g);color:#111;text-decoration:none;font-weight:800;padding:14px;border-radius:14px}.note{text-align:center;color:var(--mut);font-size:10px;margin:12px 0 0}@media(max-width:370px){.photo{height:135px}.photo+.photo{height:105px}.model{font-size:12px}}</style></head><body><main class="app"><a class="back" href="./">← ホーム</a><div class="eye">現在のセッティング</div><h1>マイバッグ</h1><div class="mut">ヘッド写真とシャフト写真で見る、自分だけの14本。</div><div class="summary"><h2>主力クラブ</h2><span id="count" class="count"></span></div><div id="filters" class="filters"></div><div id="cards" class="cards"></div><div class="note">製品写真が登録済みのモデルから実物画像で表示します</div><a class="add" href="./?add=1">＋ クラブを追加</a></main><script>const seed=[{category:'ドライバー',brand:'PING',year:'2025',model:'G440 LST',spec:'10.5°',shaft:'Fujikura VENTUS BLACK (VeloCore+) 6S',status:'MAIN'}];const HEAD_PHOTOS=[{test:/PING.*G440\s*LST/i,url:'https://i.gimg.jp/cmsimg/377152.jpg?scale=both&w=1200'}];const SHAFT_PHOTOS=[{test:/VENTUS.*BLACK/i,url:'https://www.2ndswing.com/media/wysiwyg/black.png'}];let all=[];try{all=JSON.parse(localStorage.getItem('golfClubs')||'null')||seed}catch(e){all=seed}let main=all.filter(c=>c.status==='MAIN').slice(0,14),active='すべて';const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function type(c){let s=((c.category||'')+' '+(c.model||'')+' '+(c.spec||'')).toLowerCase();if(/driver|ドライバー|g4[0-9]{2}.*(lst|max|sft)|qi[0-9]*.*driver|quantum.*(max|diamond)/i.test(s))return'driver';if(/fairway|フェアウェイ|\bfw\b|3w|5w|7w|utility|hybrid|ユーティリティ|\bhy\b/i.test(s))return'wood';if(/putter|パター|anser|newport|spider|df3|mezz|oz\.1/i.test(s))return'putter';if(/wedge|ウェッジ/i.test(s))return'wedge';return'iron'}function group(c){return({driver:'ドライバー',wood:'FW・UT',iron:'アイアン',wedge:'ウェッジ',putter:'パター'})[type(c)]}function groups(){let a=['すべて'];main.forEach(c=>{let g=group(c);if(!a.includes(g))a.push(g)});return a}function photo(list,text){let x=list.find(v=>v.test.test(text));return x?x.url:''}function imgBox(label,url,alt){return `<div class="photo"><span class="photoLabel">${label}</span>${url?`<img src="${esc(url)}" alt="${esc(alt)}" loading="eager" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="photoMissing" style="display:none">写真を読み込めませんでした</div>`:`<div class="photoMissing">写真準備中</div>`}</div>`}function setFilter(g){active=g;render()}function render(){document.getElementById('count').textContent=`${main.length} / 14本`;document.getElementById('filters').innerHTML=groups().map(g=>`<button class="filter ${active===g?'on':''}" onclick="setFilter('${g}')">${g}</button>`).join('');let shown=active==='すべて'?main:main.filter(c=>group(c)===active);let html=shown.map(c=>{let hp=photo(HEAD_PHOTOS,(c.brand||'')+' '+(c.model||'')),sp=photo(SHAFT_PHOTOS,c.shaft||'');return `<div class="card"><span class="clubNo">#${main.indexOf(c)+1}</span>${imgBox('ヘッド',hp,(c.brand||'')+' '+(c.model||''))}${imgBox('シャフト',sp,c.shaft||'')}<div class="category">${esc(group(c))}</div><div class="model">${esc(c.brand)} ${esc(c.model)}</div><div class="spec">${esc(c.spec||'スペック未登録')}</div><div class="shaftName">${esc(c.shaft||'シャフト未登録')}</div></div>`}).join('');if(active==='すべて')for(let i=main.length;i<14;i++)html+=`<div class="emptyCard">EMPTY ${i+1}</div>`;document.getElementById('cards').innerHTML=html||'<div class="emptyCard">クラブを登録してください</div>'}render();</script></body></html>
