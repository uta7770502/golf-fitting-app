<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マイバッグ | マイゴルフガレージ</title><style>:root{--bg:#090c0a;--line:#29342c;--g:#b9ff4f;--mut:#94a197;--w:#f7f9f7}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;min-height:100svh;margin:auto;padding:18px 14px 30px}.back{color:var(--g);text-decoration:none;font-size:13px}.titleRow{display:flex;align-items:end;justify-content:space-between;margin-top:10px}.eye,.sectionTitle{font-size:10px;color:var(--g);font-weight:900}.titleRow h1{font-size:34px;line-height:1;margin:5px 0}.count{font-size:14px;color:var(--g);font-weight:900}.mut{font-size:11px;color:var(--mut)}.rows{margin-top:16px;display:flex;flex-direction:column;gap:10px}.clubRow{position:relative;height:185px;border:1px solid var(--line);border-radius:16px;background:#111713;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}.photoHalf{position:relative;background:#f4f4f1;overflow:hidden;display:flex;align-items:center;justify-content:center}.photoHalf:first-of-type{border-right:4px solid var(--bg)}.photoHalf img{width:100%;height:100%;object-fit:contain}.tag,.no{position:absolute;top:8px;z-index:3;background:#080b09dc;border-radius:7px;padding:4px 7px;font-size:8px;font-weight:900}.tag{left:8px}.no{right:8px}.rowInfo,.rowShaft{position:absolute;bottom:8px;z-index:4;background:#080b09e8;border-radius:7px;padding:5px 7px;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowInfo{left:8px}.rowShaft{right:8px;font-size:9px}.rowModel{font-size:10px;font-weight:900}.missing{font-size:9px;color:#6e776f}.empty,.addRow{height:86px;border-radius:14px;display:flex;align-items:center;justify-content:center}.empty{border:1px dashed #243027;background:#0b100d;color:#39463d;font-size:10px}.empty b{font-size:19px;margin-right:7px}.addRow{text-decoration:none;border:1px dashed #405044;background:#101711;color:var(--g);font-size:11px;font-weight:900}.detail{position:fixed;inset:0;background:#070a08ed;z-index:20;display:none;align-items:flex-end}.detail.open{display:flex}.sheet{width:100%;max-width:520px;max-height:88svh;overflow:auto;margin:auto;background:#131a15;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line)}.sheetTop{display:flex;justify-content:space-between;align-items:start}.kicker{font-size:9px;color:var(--g);font-weight:900}.sheet h2{font-size:20px;margin:3px 0}.close{border:0;background:#263229;color:#fff;width:31px;height:31px;border-radius:50%;font-size:17px}.detailPhotos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.detailPhotos>div{height:135px;background:#f3f3f0;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}.detailPhotos img{width:100%;height:100%;object-fit:contain}.sectionTitle{margin:15px 0 7px}.specGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.specBox{background:#0c110e;border:1px solid #253028;border-radius:10px;padding:9px}.label{font-size:8px;color:#78867c}.value{font-size:12px;font-weight:800;margin-top:3px}.estimate{font-size:8px;color:#9aa69d;margin-top:3px}.combo{background:linear-gradient(135deg,#172118,#101511);border:1px solid #38503b;border-radius:13px;padding:11px}.comboGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.combo .value{color:var(--g);font-size:15px}.gripSelect{width:100%;margin-top:3px;background:#0b100d;color:var(--g);border:1px solid #3b4c3e;border-radius:7px;padding:5px 3px;font-size:13px;font-weight:800}.note{font-size:8px;color:#7f8c82;line-height:1.4;margin-top:8px}</style></head><body><main class="app"><a class="back" href="./">← ホーム</a><div class="titleRow"><div><div class="eye">現在のセッティング</div><h1>マイバッグ</h1></div><span id="count" class="count"></span></div><div class="mut">左がヘッド、右がシャフト。タップで詳細スペック。</div><section id="rows" class="rows"></section></main><div id="detail" class="detail" onclick="if(event.target===this)closeDetail()"><div class="sheet"><div class="sheetTop"><div><div class="kicker">クラブ詳細スペック</div><h2 id="detailTitle"></h2></div><button class="close" onclick="closeDetail()">×</button></div><div id="detailPhotos" class="detailPhotos"></div><div id="specContent"></div></div></div><script>const seed=[{category:'ドライバー',brand:'PING',year:'2025',model:'G440 LST',spec:'10.5°',shaft:'Fujikura 24 VENTUS BLACK 6S',shaftBrand:'Fujikura',shaftModel:'24 VENTUS BLACK',shaftSpec:'6S',status:'MAIN'}];const HEAD_PHOTOS=[{test:/PING.*G440\s*LST/i,url:'https://i.gimg.jp/cmsimg/377152.jpg?scale=both&w=1200'}],SHAFT_PHOTOS=[{test:/VENTUS.*BLACK/i,url:'https://www.2ndswing.com/media/wysiwyg/black.png'}];const HEAD_DB=[{test:/PING.*G440\s*LST/i,year:'2025',weight:203,lofts:'9° / 10.5°',length:45.25}];let assembly={gripWeightsG:[25,30,35,40,45,50,55,60,65,70,75,80],components:{adapter:{driver:8,fairway:8,hybrid:8,iron:0,wedge:0,putter:0},assemblyAllowanceG:{driver:2,fairway:2,hybrid:2,iron:2,wedge:2,putter:2}},defaultLengthsIn:{driver:45.25,fairway3:43,fairway5:42.5,hybrid:40.25,iron7:37,wedge:35.5,putter:34}},special={},mainstream={};let all=[],main=[],activeIndex=-1,calcBase=0;const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function loadLocal(){try{all=JSON.parse(localStorage.getItem('golfClubs')||'null')||seed}catch(e){all=seed}main=all.filter(c=>c.status==='MAIN').slice(0,14)}loadLocal();window.addEventListener('storage',e=>{if(e.key==='golfClubs'){loadLocal();render()}});window.addEventListener('pageshow',()=>{loadLocal();render()});function find(db,text){return db.find(v=>v.test.test(text))||{}}function photo(db,text){return find(db,text).url||''}function img(url,alt){return url?`<img src="${esc(url)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="missing" style="display:none">写真準備中</span>`:`<span class="missing">写真準備中</span>`}function shaftText(c){return c.shaft||[c.shaftBrand,c.shaftModel,c.shaftSpec].filter(Boolean).join(' ')}function shortShaft(c){return shaftText(c).replace(/Fujikura|Graphite Design|Mitsubishi Chemical|Nippon Shaft|UST Mamiya/ig,'').trim()}function catKey(c){let x=c.category||'';if(/ドライバー/.test(x))return'driver';if(/フェアウェイ|FW/.test(x))return'fairway';if(/ユーティリティ|HY/.test(x))return'hybrid';if(/アイアン/.test(x))return'iron';if(/ウェッジ/.test(x))return'wedge';if(/パター/.test(x))return'putter';return'driver'}function specialtySpec(c){let brand=c.shaftBrand||'',model=c.shaftModel||'',spec=c.shaftSpec||'',shaft=shaftText(c);if(!brand&&/TPT/i.test(shaft))brand='TPT';if(!brand&&/LA GOLF/i.test(shaft))brand='LA Golf';if(brand==='TPT'||/TPT/i.test(shaft)){let use=/フェアウェイ|FW/.test(c.category||'')?'Fairway':/ユーティリティ|HY/.test(c.category||'')?'Hybrid':'Driver';let root=special.TPT&&special.TPT[use];if(!root)return null;if(use==='Driver'){let family=/Nitro/i.test(model+' '+shaft)?'Nitro':'Power';root=root[family]||{};}let key=spec.match(/(?:14|15|16|17|18|19|20|21)\s*(?:HI|LO)/i)?.[0]?.toUpperCase();return key&&root[key]?{...root[key],year:'—',name:`TPT ${model||''} ${key}`}:null}if(brand==='LA Golf'||/LA GOLF/i.test(shaft)){let root=special['LA Golf']||{},series=Object.keys(root).find(k=>(model+' '+shaft).toLowerCase().includes(k.toLowerCase()))||'L Series Wood',data=root[series];if(data&&data[spec])return{...data[spec],year:'—',name:`LA GOLF ${series} ${spec}`};}return null}function mainstreamSpec(c){let shaft=shaftText(c).toLowerCase(),brand=c.shaftBrand||'',model=c.shaftModel||'',spec=(c.shaftSpec||'').replace(/\s+/g,'');let keys=Object.keys(mainstream).filter(b=>!['version','updated','note'].includes(b)),brandKey=keys.find(b=>brand.toLowerCase()===b.toLowerCase()||shaft.includes(b.toLowerCase()));if(!brandKey)brandKey=keys.find(b=>Object.keys(mainstream[b]||{}).some(m=>shaft.includes(m.toLowerCase())));if(!brandKey)return null;let models=mainstream[brandKey]||{},modelKey=Object.keys(models).find(m=>model.toLowerCase()===m.toLowerCase()||shaft.includes(m.toLowerCase()));if(!modelKey)return null;let entry=models[modelKey],specKey=spec&&entry.specs&&entry.specs[spec]?spec:null;if(!specKey&&entry.specs)specKey=Object.keys(entry.specs).find(k=>shaft.replace(/\s+/g,'').includes(k.toLowerCase()));if(!specKey)return {year:entry.year,kick:entry.kick};return {...entry.specs[specKey],year:entry.year,kick:entry.kick,name:`${brandKey} ${modelKey} ${specKey}`}}function shaftData(c){return specialtySpec(c)||mainstreamSpec(c)||{}}function render(){document.getElementById('count').textContent=`${main.length} / 14本`;let h='';for(let i=0;i<14;i++){let c=main[i];if(c){let st=shaftText(c),hp=photo(HEAD_PHOTOS,(c.brand||'')+' '+(c.model||'')),sp=photo(SHAFT_PHOTOS,st);h+=`<article class="clubRow" onclick="openDetail(${i})"><div class="photoHalf"><span class="tag">ヘッド</span>${img(hp,c.model)}</div><div class="photoHalf"><span class="tag">シャフト</span>${img(sp,st)}</div><span class="no">#${i+1}</span><div class="rowInfo"><div class="rowModel">${esc(c.brand)} ${esc(c.model)}</div></div><div class="rowShaft">${esc(shortShaft(c))}</div></article>`}else if(i===main.length)h+=`<a class="addRow" href="./?add=1">＋ ${i+1}本目を追加</a>`;else h+=`<div class="empty"><b>＋</b>${i+1}本目</div>`}document.getElementById('rows').innerHTML=h}function box(l,v,e=''){return `<div class="specBox"><div class="label">${l}</div><div class="value">${esc(v===0?'0':v||'データ準備中')}</div>${e?`<div class="estimate">${e}</div>`:''}</div>`}function gripOptions(sel){return assembly.gripWeightsG.map(g=>`<option value="${g}" ${g===sel?'selected':''}>${g}g</option>`).join('')}function updateGrip(v){let g=Number(v),total=calcBase?Math.round(calcBase+g):null;document.getElementById('totalWeight').textContent=total?total+'g':'—';if(activeIndex>=0){let c=main[activeIndex];c.gripWeight=g;let idx=all.indexOf(c);if(idx<0)idx=all.findIndex(x=>x.status==='MAIN'&&x.brand===c.brand&&x.model===c.model&&x.spec===c.spec&&shaftText(x)===shaftText(c));if(idx>=0)all[idx].gripWeight=g;try{localStorage.setItem('golfClubs',JSON.stringify(all))}catch(e){}}}function defaultLength(c,hd){if(c.length)return c.length;if(hd.length)return hd.length;let k=catKey(c);if(k==='fairway')return /5W|#5|5番/.test(c.spec||'')?assembly.defaultLengthsIn.fairway5:assembly.defaultLengthsIn.fairway3;return assembly.defaultLengthsIn[k]||'—'}function openDetail(i){activeIndex=i;let c=main[i],key=(c.brand||'')+' '+(c.model||''),st=shaftText(c),hd=find(HEAD_DB,key),sd=shaftData(c),hp=photo(HEAD_PHOTOS,key),sp=photo(SHAFT_PHOTOS,st),k=catKey(c);let headW=Number(hd.weight)||0,shaftW=Number(sd.weightG||sd.weight)||0,adapterW=Number(assembly.components.adapter[k]||0),allowance=Number(assembly.components.assemblyAllowanceG[k]||0),gripW=Number(c.gripWeight)||50;calcBase=headW&&shaftW?headW+shaftW+adapterW+allowance:0;let total=calcBase?Math.round(calcBase+gripW):null,length=defaultLength(c,hd);document.getElementById('detailTitle').textContent=key;document.getElementById('detailPhotos').innerHTML=`<div>${img(hp,c.model)}</div><div>${img(sp,st)}</div>`;let shaftYear=sd.year&&sd.year!=='—'?sd.year+'年':'データ準備中';document.getElementById('specContent').innerHTML=`<div class="sectionTitle">ヘッド</div><div class="specGrid">${box('発売年',c.year?c.year+'年':hd.year?hd.year+'年':'')}${box('ロフト / 番手',c.loft||c.spec||hd.lofts||'')}${box('ヘッド重量',headW?headW+'g':'','標準重量の目安')}</div><div class="sectionTitle">シャフト</div><div class="specGrid">${box('メーカー',c.shaftBrand||'')}${box('モデル',c.shaftModel||st||'')}${box('発売年',shaftYear)}${box('シャフト重量',shaftW?shaftW+'g':'')}${box('フレックス',sd.flex||c.shaftSpec||'')}${box('トルク',sd.torque!=null?sd.torque+'°':'')}${box('CPM',sd.cpm?sd.cpm+'':'')}${box('弾道 / 調子',sd.flight||sd.kick||'')}</div><div class="sectionTitle">組み上がり目安</div><div class="combo"><div class="comboGrid"><div><div class="label">総重量</div><div class="value" id="totalWeight">${total?total+'g':'—'}</div></div><div><div class="label">クラブ長</div><div class="value">${length!=='—'?length+'″':'—'}</div></div><div><div class="label">グリップ重量</div><select class="gripSelect" onchange="updateGrip(this.value)">${gripOptions(gripW)}</select></div></div><div class="note">総重量＝ヘッド＋シャフト＋グリップ＋スリーブ＋組立加算分の目安。可変ウェイト等の個別調整は現段階では含みません。メーカー詳細値があるシャフトはその重量を優先します。</div></div>`;document.getElementById('detail').classList.add('open')}function closeDetail(){document.getElementById('detail').classList.remove('open')}async function init(){try{let [a,s,m]=await Promise.all([fetch('data/assembly-rules-v1.json').then(r=>r.json()),fetch('data/shaft-specs-specialty-v1.json').then(r=>r.json()),fetch('data/shaft-specs-mainstream-v1.json').then(r=>r.json())]);assembly=a;special=s;mainstream=m}catch(e){console.warn('spec DB fallback',e)}loadLocal();render()}init();</script></body></html>
