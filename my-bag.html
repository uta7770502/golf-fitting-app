<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マイバッグ | マイゴルフガレージ</title><style>:root{--bg:#090c0a;--card:#141a16;--line:#29342c;--g:#b9ff4f;--mut:#94a197;--w:#f7f9f7}*{box-sizing:border-box}body{margin:0;background:#090c0a;color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;padding:20px 16px 92px}.back{color:var(--g);text-decoration:none;font-size:13px}.eye{margin-top:18px;font-size:10px;letter-spacing:.14em;color:var(--g);font-weight:800}h1{font-size:34px;margin:5px 0}.mut{color:var(--mut);font-size:12px}.hero{position:relative;height:430px;margin:18px 0 10px;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#263329 0,#121914 36%,#0b0f0c 72%)}.bagbody{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);width:310px;height:235px;background:linear-gradient(100deg,#101411,#313a33 42%,#151b17 72%,#0c100d);clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);border-radius:26px 26px 52px 52px;box-shadow:0 30px 45px #000}.rim{position:absolute;left:50%;bottom:184px;transform:translateX(-50%);width:285px;height:68px;border-radius:50%;background:#080a09;border:14px solid #39443c;box-shadow:inset 0 0 0 4px #151a17,0 9px 15px #0008}.divider{position:absolute;left:50%;bottom:211px;width:235px;height:3px;background:#313a33;transform:translateX(-50%)}.baglogo{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);font-size:18px;font-weight:900;letter-spacing:.18em;color:#dce4de}.count{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);font-size:11px;color:var(--g)}.clubs{position:absolute;left:50%;bottom:211px;width:390px;height:220px;transform:translateX(-50%)}.club{position:absolute;left:50%;bottom:0;width:44px;height:215px;transform-origin:50% 100%;cursor:pointer;filter:drop-shadow(0 5px 4px #0008)}.shaft{position:absolute;width:4px;height:160px;left:20px;bottom:0;border-radius:4px;background:linear-gradient(90deg,#303732,#c3cbc5 48%,#3b443e)}.head{position:absolute;left:5px;top:0;width:34px;height:42px;border:2px solid #77847b}.driver .head{width:58px;height:52px;left:-8px;border-radius:52% 48% 45% 50%;background:linear-gradient(145deg,#050706,#333b35 52%,#111);box-shadow:inset -8px -5px 12px #000}.wood .head{width:49px;height:43px;left:-3px;border-radius:52% 48% 45% 50%;background:linear-gradient(145deg,#111713,#37423a)}.iron .head{width:34px;height:47px;left:5px;transform:skew(-9deg);border-radius:5px;background:linear-gradient(135deg,#e3e7e4,#747d77 58%,#c3c9c5)}.wedge .head{width:38px;height:43px;left:3px;transform:skew(-7deg);border-radius:7px;background:linear-gradient(135deg,#e6e9e7,#6d766f)}.putter .head{width:52px;height:20px;left:-4px;top:25px;border-radius:5px;background:linear-gradient(135deg,#d9ddda,#6c756f)}.head:after{content:attr(data-mark);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:900;color:#dfe5e1;letter-spacing:-.03em}.iron .head:after,.wedge .head:after,.putter .head:after{color:#202521}.badge{position:absolute;top:48px;left:50%;transform:translateX(-50%);font-size:7px;background:#080b09e8;border:1px solid #46544b;border-radius:12px;padding:3px 5px;white-space:nowrap;color:#fff}.sectionTitle{display:flex;align-items:end;justify-content:space-between;margin:24px 2px 10px}.sectionTitle h2{font-size:19px;margin:0}.sectionTitle b{color:var(--g)}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.filter{white-space:nowrap;border:1px solid var(--line);background:#111713;color:#9ba69e;border-radius:20px;padding:8px 12px;font-size:11px}.filter.on{background:var(--g);color:#111;border-color:var(--g);font-weight:800}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{position:relative;min-height:172px;background:linear-gradient(145deg,#171e19,#101511);border:1px solid var(--line);border-radius:18px;padding:13px;overflow:hidden}.minihead{height:72px;display:flex;align-items:center;justify-content:center}.mini{position:relative;width:55px;height:58px;border:2px solid #748078;background:linear-gradient(145deg,#111,#343d37);border-radius:45%}.mini.iron,.mini.wedge{width:40px;height:58px;border-radius:5px;background:linear-gradient(135deg,#e2e6e3,#747d77)}.mini.putter{width:62px;height:20px;border-radius:4px;background:#aeb6b0}.mini:after{content:attr(data-mark);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900}.card .cat{font-size:9px;color:var(--g);font-weight:800}.card b{display:block;font-size:13px;margin-top:4px}.card .spec{font-size:11px;color:#d0d6d2;margin-top:4px}.card .shaftname{font-size:9px;color:var(--mut);margin-top:5px;line-height:1.3}.empty{text-align:center;padding:45px 15px;color:var(--mut)}.hint{text-align:center;color:var(--mut);font-size:10px;margin:8px}.add{display:block;margin:14px 0 0;text-align:center;background:var(--g);color:#111;text-decoration:none;font-weight:800;padding:13px;border-radius:14px}</style></head><body><main class="app"><a class="back" href="./">← ホーム</a><div class="eye">現在のセッティング</div><h1>マイバッグ</h1><div class="mut">今の主力14本を、ひとつのコレクションとして。</div><div class="hero"><div id="clubs" class="clubs"></div><div class="bagbody"></div><div class="rim"></div><div class="divider"></div><div class="baglogo">MY GOLF GARAGE</div><div id="count" class="count"></div></div><div class="hint">バッグ内のクラブをタップすると詳細へ移動します</div><div class="sectionTitle"><h2>クラブ一覧 <b id="listCount"></b></h2></div><div id="filters" class="filters"></div><div id="cards" class="cards"></div><a class="add" href="./?add=1">＋ クラブを追加</a></main><script>const seed=[{category:'ドライバー',brand:'PING',year:'2025',model:'G440 LST',spec:'10.5°',shaft:'Fujikura 24 VENTUS BLACK 6S',status:'MAIN'}];let all=[];try{all=JSON.parse(localStorage.getItem('golfClubs')||'null')||seed}catch(e){all=seed}let main=all.filter(c=>c.status==='MAIN').slice(0,14),active='すべて';const type=c=>{let s=(c.category||'').toLowerCase();if(s.includes('ドライバー'))return'driver';if(s.includes('フェアウェイ')||s.includes('ユーティリティ')||s.includes('hy'))return'wood';if(s.includes('パター'))return'putter';if(s.includes('ウェッジ'))return'wedge';return'iron'};const shortType=c=>({driver:'DR',wood:'FW/UT',iron:'IRON',wedge:'WEDGE',putter:'PT'})[type(c)];const mark=c=>{let b=(c.brand||'').toUpperCase();if(b.includes('PING'))return'PING';if(b.includes('TITLEIST'))return'T';if(b.includes('CALLAWAY'))return'C';if(b.includes('TAYLOR'))return'TM';if(b.includes('LAB')||b.includes('L.A.B'))return'LAB';return (c.brand||'CLUB').slice(0,5).toUpperCase()};function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function drawBag(){document.getElementById('count').textContent=`${main.length} / 14 本`;if(!main.length){document.getElementById('clubs').innerHTML='<div class="empty">使用中のクラブを登録すると、ここにバッグが完成します。</div>';return}let n=main.length;document.getElementById('clubs').innerHTML=main.map((c,i)=>{let center=(n-1)/2,d=i-center,spread=n>8?10:16,x=d*spread,angle=d*(n>8?2.5:4),y=Math.abs(d)*2.3,z=40-Math.abs(d);return `<div class="club ${type(c)}" style="transform:translateX(${x}px) translateY(${y}px) rotate(${angle}deg);z-index:${z}" onclick="focusClub(${i})"><div class="shaft"></div><div class="head" data-mark="${esc(mark(c))}"></div><div class="badge">${esc(c.spec||shortType(c))}</div></div>`}).join('')}function groups(){let arr=['すべて'];main.forEach(c=>{let t=type(c),g=t==='driver'?'ドライバー':t==='wood'?'FW・UT':t==='iron'?'アイアン':t==='wedge'?'ウェッジ':'パター';if(!arr.includes(g))arr.push(g)});return arr}function group(c){let t=type(c);return t==='driver'?'ドライバー':t==='wood'?'FW・UT':t==='iron'?'アイアン':t==='wedge'?'ウェッジ':'パター'}function renderCards(){document.getElementById('listCount').textContent=`${main.length}本`;document.getElementById('filters').innerHTML=groups().map(g=>`<button class="filter ${active===g?'on':''}" onclick="setFilter('${g}')">${g}${g==='すべて'?` (${main.length})`:` (${main.filter(c=>group(c)===g).length})`}</button>`).join('');let shown=active==='すべて'?main:main.filter(c=>group(c)===active);document.getElementById('cards').innerHTML=shown.map((c)=>`<div class="card"><div class="minihead"><div class="mini ${type(c)}" data-mark="${esc(mark(c))}"></div></div><div class="cat">${esc(group(c))}</div><b>${esc(c.brand)} ${esc(c.model)}</b><div class="spec">${esc(c.spec||'スペック未登録')}</div><div class="shaftname">${esc(c.shaft||'シャフト未登録')}</div></div>`).join('')||'<div class="empty">該当するクラブはありません</div>'}function setFilter(g){active=g;renderCards()}function focusClub(i){active=group(main[i]);renderCards();document.querySelector('.sectionTitle').scrollIntoView({behavior:'smooth',block:'start'})}drawBag();renderCards();</script></body></html>
