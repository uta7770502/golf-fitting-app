<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マイバッグ | マイゴルフガレージ</title><style>:root{--bg:#090c0a;--card:#141a16;--line:#29342c;--g:#b9ff4f;--mut:#94a197;--w:#f7f9f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;padding:20px 16px 90px}.back{color:var(--g);text-decoration:none;font-size:13px}.eye{margin-top:18px;font-size:10px;letter-spacing:.14em;color:var(--g);font-weight:800}h1{font-size:34px;margin:5px 0}.mut{color:var(--mut);font-size:12px}.summary{display:flex;justify-content:space-between;align-items:end;margin:20px 0 12px}.summary h2{margin:0;font-size:18px}.count{color:var(--g);font-size:12px;font-weight:800}.filters{display:flex;gap:7px;overflow:auto;margin-bottom:12px;scrollbar-width:none}.filter{white-space:nowrap;border:1px solid var(--line);background:#111713;color:#9ba69e;border-radius:20px;padding:8px 12px;font-size:11px}.filter.on{background:var(--g);color:#111;border-color:var(--g);font-weight:800}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{position:relative;min-height:350px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,#182019,#0e130f);padding:12px;overflow:hidden}.clubVisual{height:225px;position:relative}.shaft{position:absolute;left:52%;top:83px;transform:translateX(-50%);width:9px;height:133px;border-radius:5px;background:var(--shaft);box-shadow:inset 2px 0 #fff2,inset -2px 0 #0009}.shaft:after{content:attr(data-shaft);position:absolute;left:50%;top:43px;transform:translateX(-50%) rotate(-90deg);width:115px;text-align:center;white-space:nowrap;font-size:7px;font-weight:900;color:var(--shaftText)}.hosel{position:absolute;left:calc(52% - 1px);top:66px;width:10px;height:25px;border-radius:4px;background:linear-gradient(90deg,#59635c,#d7dcd8,#606a63);transform:rotate(-10deg);transform-origin:bottom}.head{position:absolute;left:50%;top:12px;filter:drop-shadow(0 7px 8px #000b)}.driver .head{width:112px;height:73px;transform:translateX(-55%) rotate(-5deg);border-radius:58% 42% 47% 38% / 60% 45% 55% 40%;background:radial-gradient(circle at 65% 35%,#4c5850 0,#222a25 33%,#070908 75%);border:2px solid #606d64}.driver .head:before{content:'';position:absolute;right:-7px;bottom:12px;width:25px;height:24px;border-radius:4px 14px 12px 3px;background:#202722;transform:rotate(8deg)}.wood .head{width:92px;height:61px;transform:translateX(-55%) rotate(-5deg);border-radius:58% 42% 48% 40%;background:radial-gradient(circle at 65% 35%,#465249,#111713 70%);border:2px solid #59665d}.wood .head:before{content:'';position:absolute;right:-6px;bottom:10px;width:20px;height:20px;background:#1d251f;border-radius:3px 12px 10px 3px}.iron .head,.wedge .head{width:78px;height:75px;transform:translateX(-61%) rotate(-8deg);clip-path:polygon(12% 4%,83% 0,100% 16%,88% 86%,57% 100%,5% 82%,0 25%);background:linear-gradient(135deg,#f0f2f0 0,#8d9690 43%,#e3e7e4 65%,#5f6962 100%);border:none}.iron .head:before,.wedge .head:before{content:'';position:absolute;left:13px;right:12px;top:12px;bottom:13px;clip-path:polygon(10% 7%,87% 4%,96% 25%,82% 79%,55% 92%,9% 75%,3% 28%);background:linear-gradient(145deg,#555f58,#b9c0bb);box-shadow:inset 0 0 0 2px #e9ecea55}.wedge .head{width:82px;height:77px;border-radius:0;background:linear-gradient(135deg,#f4f5f4,#77817a 48%,#e4e7e5)}.putter .head{top:43px;width:108px;height:28px;transform:translateX(-55%);border-radius:6px 6px 10px 10px;background:linear-gradient(135deg,#e5e8e6,#6b756e);border:2px solid #aeb6b0}.putter .hosel{top:49px;height:42px;left:48%;transform:rotate(-14deg)}.headLabel{position:absolute;left:50%;top:37px;transform:translate(-50%,-50%);z-index:3;font-size:8px;font-weight:950;color:#f4f6f4;pointer-events:none}.iron .headLabel,.wedge .headLabel{color:#202620}.putter .headLabel{top:56px;color:#1c221e}.clubNo{position:absolute;right:10px;top:10px;font-size:10px;color:#6f7c73}.category{font-size:9px;color:var(--g);font-weight:900}.model{font-size:14px;font-weight:850;line-height:1.15;margin-top:5px;min-height:32px}.spec{font-size:11px;color:#e1e6e2;margin-top:5px}.shaftName{font-size:10px;color:var(--mut);line-height:1.35;margin-top:7px}.emptyCard{min-height:350px;border:1px dashed #263129;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#526057;font-size:11px}.add{display:block;margin:16px 0 0;text-align:center;background:var(--g);color:#111;text-decoration:none;font-weight:800;padding:14px;border-radius:14px}.note{text-align:center;color:var(--mut);font-size:10px;margin:12px 0 0}@media(max-width:370px){.card{min-height:335px;padding:10px}.driver .head{width:100px}.model{font-size:12px}}</style></head><body><main class="app"><a class="back" href="./">← ホーム</a><div class="eye">現在のセッティング</div><h1>マイバッグ</h1><div class="mut">ヘッド形状とシャフトまで見える、自分だけの14本。</div><div class="summary"><h2>主力クラブ</h2><span id="count" class="count"></span></div><div id="filters" class="filters"></div><div id="cards" class="cards"></div><div class="note">登録情報からクラブ種別・ヘッド形状・シャフト表示を自動判定</div><a class="add" href="./?add=1">＋ クラブを追加</a></main><script>const seed=[{category:'ドライバー',brand:'PING',year:'2025',model:'G440 LST',spec:'10.5°',shaft:'Fujikura VENTUS BLACK (VeloCore+) 6S',status:'MAIN'}];let all=[];try{all=JSON.parse(localStorage.getItem('golfClubs')||'null')||seed}catch(e){all=seed}let main=all.filter(c=>c.status==='MAIN').slice(0,14),active='すべて';const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function type(c){let s=((c.category||'')+' '+(c.model||'')+' '+(c.spec||'')).toLowerCase();if(/driver|ドライバー|g4[0-9]{2}.*(lst|max|sft)|qi[0-9]*.*driver|quantum.*(max|diamond)/i.test(s))return'driver';if(/fairway|フェアウェイ|\bfw\b|3w|5w|7w|utility|hybrid|ユーティリティ|\bhy\b/i.test(s))return'wood';if(/putter|パター|anser|newport|spider|df3|mezz|oz\.1/i.test(s))return'putter';if(/wedge|ウェッジ|\b[456][02468]°|\b5[02468]°|\b6[0-4]°/i.test(s))return'wedge';return'iron'}function group(c){return({driver:'ドライバー',wood:'FW・UT',iron:'アイアン',wedge:'ウェッジ',putter:'パター'})[type(c)]}function brandMark(c){let b=(c.brand||'').toUpperCase();if(b.includes('PING'))return'PING';if(b.includes('TITLEIST'))return'TITLEIST';if(b.includes('CALLAWAY'))return'CALLAWAY';if(b.includes('TAYLOR'))return'TM';if(b.includes('SRIXON'))return'SRIXON';if(b.includes('MIZUNO'))return'MIZUNO';if(b.includes('LAB')||b.includes('L.A.B'))return'L.A.B.';return(c.brand||'CLUB').slice(0,9).toUpperCase()}function shaftStyle(c){let s=(c.shaft||'').toUpperCase();if(s.includes('VENTUS BLACK'))return['#111613','#fff','VENTUS BLACK'];if(s.includes('VENTUS BLUE'))return['#174d7d','#fff','VENTUS BLUE'];if(s.includes('VENTUS RED'))return['#962d2d','#fff','VENTUS RED'];if(s.includes('TOUR AD'))return['#e7e9e7','#111','TOUR AD'];if(s.includes('DIAMANA'))return['#182838','#fff','DIAMANA'];if(s.includes('TENSEI'))return['#c9d0cb','#111','TENSEI'];if(s.includes('SPEEDER'))return['#24527f','#fff','SPEEDER'];if(s.includes('MODUS'))return['#b9bdbb','#111','MODUS'];if(s.includes('DYNAMIC GOLD'))return['#c8cbc9','#111','DYNAMIC GOLD'];return['#3c4640','#fff',(c.shaft||'SHAFT').split(' ').slice(0,2).join(' ')]}function groups(){let a=['すべて'];main.forEach(c=>{let g=group(c);if(!a.includes(g))a.push(g)});return a}function setFilter(g){active=g;render()}function render(){document.getElementById('count').textContent=`${main.length} / 14本`;document.getElementById('filters').innerHTML=groups().map(g=>`<button class="filter ${active===g?'on':''}" onclick="setFilter('${g}')">${g}</button>`).join('');let shown=active==='すべて'?main:main.filter(c=>group(c)===active);let html=shown.map(c=>{let sh=shaftStyle(c),t=type(c);return `<div class="card ${t}"><span class="clubNo">#${main.indexOf(c)+1}</span><div class="clubVisual"><div class="shaft" style="--shaft:${sh[0]};--shaftText:${sh[1]}" data-shaft="${esc(sh[2])}"></div><div class="hosel"></div><div class="head"></div><div class="headLabel">${esc(brandMark(c))}</div></div><div class="category">${esc(group(c))}</div><div class="model">${esc(c.brand)}<br>${esc(c.model)}</div><div class="spec">${esc(c.spec||'スペック未登録')}</div><div class="shaftName">${esc(c.shaft||'シャフト未登録')}</div></div>`}).join('');if(active==='すべて')for(let i=main.length;i<14;i++)html+=`<div class="emptyCard">EMPTY ${i+1}</div>`;document.getElementById('cards').innerHTML=html||'<div class="emptyCard">クラブを登録してください</div>'}render();</script></body></html>
