<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マイバッグ | マイゴルフガレージ</title><style>:root{--bg:#090c0a;--card:#121814;--line:#29342c;--g:#b9ff4f;--mut:#94a197;--w:#f7f9f7}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;height:100svh;margin:auto;padding:13px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}.top{flex:0 0 auto}.back{color:var(--g);text-decoration:none;font-size:11px}.titleRow{display:flex;align-items:end;justify-content:space-between;margin-top:6px}.eye{font-size:8px;letter-spacing:.12em;color:var(--g);font-weight:900}.titleRow h1{font-size:25px;line-height:1;margin:3px 0 0}.count{font-size:11px;color:var(--g);font-weight:900}.mut{font-size:8px;color:var(--mut);margin-top:4px}.rows{flex:1;min-height:0;margin-top:8px;display:grid;grid-template-rows:repeat(14,minmax(0,1fr));gap:3px}.clubRow{position:relative;min-height:0;border:1px solid var(--line);border-radius:9px;background:linear-gradient(90deg,#182019,#0e130f);overflow:hidden;display:grid;grid-template-columns:1fr 1fr;cursor:pointer}.photoHalf{position:relative;min-width:0;min-height:0;background:#f4f4f1;overflow:hidden;display:flex;align-items:center;justify-content:center}.photoHalf:first-of-type{border-right:2px solid var(--bg)}.photoHalf img{width:100%;height:100%;object-fit:contain;display:block}.photoHalf.shaft img{object-fit:cover}.tag{position:absolute;left:4px;top:3px;z-index:3;background:#080b09d9;color:#fff;border-radius:5px;padding:2px 4px;font-size:5px;font-weight:900}.rowInfo{position:absolute;left:5px;bottom:3px;z-index:4;max-width:47%;background:#080b09e6;border-radius:5px;padding:2px 4px;line-height:1.05}.rowModel{font-size:6px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowShaft{position:absolute;right:5px;bottom:3px;z-index:4;max-width:47%;background:#080b09e6;border-radius:5px;padding:2px 4px;font-size:5.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.no{position:absolute;right:4px;top:3px;z-index:5;background:#080b09d9;border-radius:6px;padding:2px 4px;font-size:5px}.missing{font-size:6px;color:#6e776f}.empty{border:1px dashed #243027;background:#0b100d;display:flex;align-items:center;justify-content:center;color:#39463d;font-size:6px}.empty b{font-size:12px;margin-right:5px;font-weight:300}.addRow{text-decoration:none;border:1px dashed #405044;background:#101711;color:var(--g);display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:900}.detail{position:fixed;inset:0;background:#070a08ed;z-index:20;display:none;align-items:flex-end}.detail.open{display:flex}.sheet{width:100%;max-width:520px;margin:auto;background:#131a15;border-radius:22px 22px 0 0;padding:15px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line)}.sheetTop{display:flex;justify-content:space-between;gap:12px}.sheet h2{font-size:19px;margin:0}.close{border:0;background:#263229;color:#fff;width:31px;height:31px;border-radius:50%;font-size:17px}.detailPhotos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.detailPhotos>div{height:165px;background:#f3f3f0;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}.detailPhotos img{width:100%;height:100%;object-fit:contain}.detailMeta{font-size:11px;color:#c8d0ca;line-height:1.5;margin-top:10px}@media(max-height:700px){.app{padding-top:8px}.mut{display:none}.rows{margin-top:5px;gap:2px}.titleRow h1{font-size:21px}}</style></head><body><main class="app"><div class="top"><a class="back" href="./">← ホーム</a><div class="titleRow"><div><div class="eye">現在のセッティング</div><h1>マイバッグ</h1></div><span id="count" class="count"></span></div><div class="mut">1本＝横1列。左にヘッド、右にシャフト。14本を一画面で確認。</div></div><section id="rows" class="rows"></section></main><div id="detail" class="detail" onclick="if(event.target===this)closeDetail()"><div class="sheet"><div class="sheetTop"><h2 id="detailTitle"></h2><button class="close" onclick="closeDetail()">×</button></div><div id="detailPhotos" class="detailPhotos"></div><div id="detailMeta" class="detailMeta"></div></div></div><script>const seed=[{category:'ドライバー',brand:'PING',year:'2025',model:'G440 LST',spec:'10.5°',loft:'10.5°',shaft:'Fujikura VENTUS BLACK (VeloCore+) 6S',status:'MAIN'}];const HEAD_PHOTOS=[{test:/PING.*G440\s*LST/i,url:'https://i.gimg.jp/cmsimg/377152.jpg?scale=both&w=1200'}];const SHAFT_PHOTOS=[{test:/VENTUS.*BLACK/i,url:'https://www.2ndswing.com/media/wysiwyg/black.png'}];let all=[];try{all=JSON.parse(localStorage.getItem('golfClubs')||'null')||seed}catch(e){all=seed}let main=all.filter(c=>c.status==='MAIN').slice(0,14);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function photo(list,text){let x=list.find(v=>v.test.test(text));return x?x.url:''}function img(url,alt){return url?`<img src="${esc(url)}" alt="${esc(alt)}" loading="eager" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="missing" style="display:none">写真準備中</span>`:`<span class="missing">写真準備中</span>`}function shortShaft(s=''){return s.replace(/Fujikura|Graphite Design|Mitsubishi Chemical|Nippon Shaft/ig,'').trim()}function render(){document.getElementById('count').textContent=`${main.length} / 14本`;let h='';for(let i=0;i<14;i++){let c=main[i];if(c){let hp=photo(HEAD_PHOTOS,(c.brand||'')+' '+(c.model||'')),sp=photo(SHAFT_PHOTOS,c.shaft||'');h+=`<article class="clubRow" onclick="openDetail(${i})"><div class="photoHalf"><span class="tag">HEAD</span>${img(hp,(c.brand||'')+' '+(c.model||''))}</div><div class="photoHalf shaft"><span class="tag">SHAFT</span>${img(sp,c.shaft||'')}</div><span class="no">${i+1}</span><div class="rowInfo"><div class="rowModel">${esc(c.brand||'')} ${esc(c.model||'')}</div></div><div class="rowShaft">${esc(shortShaft(c.shaft||'シャフト未登録'))}</div></article>`}else if(i===13){h+=`<a class="addRow" href="./?add=1">＋ クラブ追加</a>`}else{h+=`<div class="empty"><b>＋</b>${i+1}</div>`}}document.getElementById('rows').innerHTML=h}function openDetail(i){let c=main[i],hp=photo(HEAD_PHOTOS,(c.brand||'')+' '+(c.model||'')),sp=photo(SHAFT_PHOTOS,c.shaft||'');document.getElementById('detailTitle').textContent=(c.brand||'')+' '+(c.model||'');document.getElementById('detailPhotos').innerHTML=`<div>${img(hp,c.model||'ヘッド')}</div><div>${img(sp,c.shaft||'シャフト')}</div>`;document.getElementById('detailMeta').innerHTML=`${esc(c.category||'')}　${esc(c.year?c.year+'年':'')}　${esc(c.loft||c.spec||'')}<br>${esc(c.shaft||'シャフト未登録')}`;document.getElementById('detail').classList.add('open')}function closeDetail(){document.getElementById('detail').classList.remove('open')}render();</script></body></html>
