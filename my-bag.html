<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マイバッグ | マイゴルフガレージ</title><style>:root{--bg:#090c0a;--card:#141a16;--line:#29342c;--g:#b9ff4f;--mut:#94a197;--w:#f7f9f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 18%,#1a241d 0,#090c0a 48%);color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;padding:22px 18px 70px}.back{color:var(--g);text-decoration:none;font-size:13px}.eye{margin-top:20px;font-size:10px;letter-spacing:.14em;color:var(--g);font-weight:800}h1{font-size:30px;margin:6px 0}.mut{color:var(--mut);font-size:12px}.stage{height:510px;position:relative;margin:22px 0 12px;overflow:hidden;border-radius:28px;background:linear-gradient(180deg,#101711 0%,#0b0f0c 70%);border:1px solid var(--line)}.clubs{position:absolute;left:50%;bottom:155px;width:360px;height:315px;transform:translateX(-50%)}.club{position:absolute;left:50%;bottom:0;width:42px;height:285px;transform-origin:50% 100%;cursor:pointer}.shaft{position:absolute;width:4px;height:225px;left:19px;bottom:0;background:linear-gradient(90deg,#5f6862,#d4d8d5,#565f59);border-radius:3px}.head{position:absolute;left:5px;top:0;width:34px;height:42px;background:#222b25;border:2px solid #7f8b83;box-shadow:0 5px 14px #0008}.driver .head{width:48px;height:40px;left:-3px;border-radius:45% 55% 40% 48%;background:linear-gradient(145deg,#111,#343d37)}.wood .head{width:42px;height:34px;left:0;border-radius:45%;background:#202923}.iron .head,.wedge .head{width:32px;height:38px;transform:skew(-8deg);border-radius:5px;background:linear-gradient(135deg,#c7ccc8,#646d67)}.putter .head{width:45px;height:15px;left:-2px;top:25px;border-radius:4px;background:#b9c0bb}.tag{position:absolute;top:46px;left:50%;transform:translateX(-50%);font-size:8px;background:#0a0e0bcc;border:1px solid #405047;border-radius:10px;padding:3px 5px;white-space:nowrap;color:#dce3de}.bag{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:225px;height:245px;background:linear-gradient(90deg,#121713,#252d27 48%,#111612);clip-path:polygon(17% 0,83% 0,96% 100%,4% 100%);border-radius:18px 18px 42px 42px;filter:drop-shadow(0 20px 18px #0009)}.rim{position:absolute;left:50%;bottom:238px;transform:translateX(-50%);width:190px;height:45px;border-radius:50%;background:#080b09;border:9px solid #343e37;box-shadow:inset 0 0 0 2px #111}.logo{position:absolute;left:50%;bottom:103px;transform:translateX(-50%);font-size:21px;font-weight:900;letter-spacing:.08em;color:var(--g)}.count{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);font-size:11px;color:#9faa9f}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:12px}.clubline{padding:12px 0;border-bottom:1px solid var(--line)}.clubline:last-child{border:0}.pill{display:inline-block;font-size:9px;color:var(--g);border:1px solid #425148;border-radius:20px;padding:4px 7px;margin-top:5px}.empty{text-align:center;padding:50px 20px;color:var(--mut)}.hint{text-align:center;font-size:11px;color:var(--mut);margin:5px 0 20px}</style></head><body><main class="app"><a class="back" href="./">← ホーム</a><div class="eye">現在の14本</div><h1>マイバッグ</h1><div class="mut">今使っているクラブだけを、ひとつのバッグとして眺められます。</div><div class="stage"><div id="clubs" class="clubs"></div><div class="bag"></div><div class="rim"></div><div class="logo">MY BAG</div><div id="count" class="count"></div></div><div class="hint">クラブをタップすると下の詳細へ移動します</div><div id="list" class="card"></div></main><script>const seed=[{category:'ドライバー',brand:'PING',year:'2025',model:'G440 LST',spec:'10.5°',shaft:'Fujikura 24 VENTUS BLACK 6S',status:'MAIN'}];let all=[];try{all=JSON.parse(localStorage.getItem('golfClubs')||'null')||seed}catch(e){all=seed}let main=all.filter(c=>c.status==='MAIN').slice(0,14);const type=c=>{let s=(c.category||'').toLowerCase();if(s.includes('ドライバー'))return'driver';if(s.includes('フェアウェイ')||s.includes('ユーティリティ')||s.includes('hy'))return'wood';if(s.includes('パター'))return'putter';if(s.includes('ウェッジ'))return'wedge';return'iron'};function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){document.getElementById('count').textContent=`${main.length} / 14 CLUBS`;if(!main.length){document.getElementById('clubs').innerHTML='<div class="empty">使用中のクラブを登録すると、ここにバッグが完成します。</div>';document.getElementById('list').innerHTML='<div class="empty">まだクラブがありません</div>';return}let n=main.length;document.getElementById('clubs').innerHTML=main.map((c,i)=>{let center=(n-1)/2,delta=i-center,angle=delta*4.1,x=delta*12,y=Math.abs(delta)*4;return `<div class="club ${type(c)}" style="transform:translateX(${x}px) translateY(${y}px) rotate(${angle}deg);z-index:${30-Math.abs(delta)}" onclick="document.getElementById('club${i}').scrollIntoView({behavior:'smooth',block:'center'})"><div class="shaft"></div><div class="head"></div><div class="tag">${esc(c.spec||c.model||'CLUB')}</div></div>`}).join('');document.getElementById('list').innerHTML=main.map((c,i)=>`<div class="clubline" id="club${i}"><b>${esc(c.brand)} ${esc(c.model)}</b><div class="mut">${esc(c.category||'クラブ')} · ${esc(c.spec||'スペック未登録')}${c.shaft?'<br>'+esc(c.shaft):''}</div><span class="pill">使用中</span></div>`).join('')}render();</script></body></html>
