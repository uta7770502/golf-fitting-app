<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マイバッグ | マイゴルフガレージ</title><style>:root{--bg:#090c0a;--line:#29342c;--g:#b9ff4f;--mut:#94a197;--w:#f7f9f7}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;min-height:100svh;margin:auto;padding:18px 14px 30px}.back{color:var(--g);text-decoration:none;font-size:13px}.titleRow{display:flex;align-items:end;justify-content:space-between;margin-top:10px}.eye{font-size:10px;color:var(--g);font-weight:900}.titleRow h1{font-size:34px;line-height:1;margin:5px 0}.count{font-size:14px;color:var(--g);font-weight:900}.mut{font-size:11px;color:var(--mut)}.rows{margin-top:16px;display:flex;flex-direction:column;gap:10px}.clubRow{position:relative;height:185px;border:1px solid var(--line);border-radius:16px;background:#111713;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}.photoHalf{position:relative;background:#f4f4f1;overflow:hidden;display:flex;align-items:center;justify-content:center}.photoHalf:first-of-type{border-right:4px solid var(--bg)}.photoHalf img{width:100%;height:100%;object-fit:contain}.tag{position:absolute;left:8px;top:8px;z-index:3;background:#080b09dc;border-radius:7px;padding:4px 7px;font-size:8px;font-weight:900}.no{position:absolute;right:8px;top:8px;z-index:5;background:#080b09dc;border-radius:7px;padding:4px 7px;font-size:8px}.rowInfo,.rowShaft{position:absolute;bottom:8px;z-index:4;background:#080b09e8;border-radius:7px;padding:5px 7px;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowInfo{left:8px}.rowShaft{right:8px;font-size:9px}.rowModel{font-size:10px;font-weight:900}.missing{font-size:9px;color:#6e776f}.empty,.addRow{height:86px;border-radius:14px;display:flex;align-items:center;justify-content:center}.empty{border:1px dashed #243027;background:#0b100d;color:#39463d;font-size:10px}.empty b{font-size:19px;margin-right:7px}.addRow{text-decoration:none;border:1px dashed #405044;background:#101711;color:var(--g);font-size:11px;font-weight:900}.detail{position:fixed;inset:0;background:#070a08ed;z-index:20;display:none;align-items:flex-end}.detail.open{display:flex}.sheet{width:100%;max-width:520px;max-height:88svh;overflow:auto;margin:auto;background:#131a15;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line)}.sheetTop{display:flex;justify-content:space-between;align-items:start}.kicker{font-size:9px;color:var(--g);font-weight:900}.sheet h2{font-size:20px;margin:3px 0 0}.close{border:0;background:#263229;color:#fff;width:31px;height:31px;border-radius:50%;font-size:17px}.detailPhotos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.detailPhotos>div{height:135px;background:#f3f3f0;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}.detailPhotos img{width:100%;height:100%;object-fit:contain}.sectionTitle{font-size:10px;color:var(--g);font-weight:900;margin:15px 0 7px}.specGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.specBox{background:#0c110e;border:1px solid #253028;border-radius:10px;padding:9px}.label{font-size:8px;color:#78867c}.value{font-size:12px;font-weight:800;margin-top:3px}.estimate{font-size:8px;color:#9aa69d;margin-top:3px}.combo{background:linear-gradient(135deg,#172118,#101511);border:1px solid #38503b;border-radius:13px;padding:11px}.comboGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.combo .value{color:var(--g);font-size:15px}.gripSelect{width:100%;margin-top:3px;background:#0b100d;color:var(--g);border:1px solid #3b4c3e;border-radius:7px;padding:5px 3px;font-size:13px;font-weight:800}.note{font-size:8px;color:#7f8c82;line-height:1.4;margin-top:8px}</style></head><body><main class="app"><a class="back" href="./">← ホーム</a><div class="titleRow"><div><div class="eye">現在のセッティング</div><h1>マイバッグ</h1></div><span id="count" class="count"></span></div><div class="mut">左がヘッド、右がシャフト。タップで詳細スペック。</div><section id="rows" class="rows"></section></main><div id="detail" class="detail" onclick="if(event.target===this)closeDetail()"><div class="sheet"><div class="sheetTop"><div><div class="kicker">CLUB SPEC</div><h2 id="detailTitle"></h2></div><button class="close" onclick="closeDetail()">×</button></div><div id="detailPhotos" class="detailPhotos"></div><div id="specContent"></div></div></div><script>const seed=[{category:'ドライバー',brand:'PING',year:'2025',model:'G440 LST',spec:'10.5°',loft:'10.5°',shaft:'Fujikura VENTUS BLACK (VeloCore+) 6S',status:'MAIN'}];const HEAD_PHOTOS=[{test:/PING.*G440\s*LST/i,url:'https://i.gimg.jp/cmsimg/377152.jpg?scale=both&w=1200'}];const SHAFT_PHOTOS=[{test:/VENTUS.*BLACK/i,url:'https://www.2ndswing.com/media/wysiwyg/black.png'}];const HEAD_DB=[{test:/PING.*G440\s*LST/i,year:'2025',weight:203,lofts:'9° / 10.5°',length:45.25}];const SHAFT_DB=[{test:/VENTUS.*BLACK.*6S/i,year:'2024',weight:65.5,torque:'3.3°',kick:'元調子',rawLength:46},{test:/VENTUS.*BLACK/i,year:'2024',weight:65,torque:'約3.3°',kick:'元調子',rawLength:46}];const GRIP_WEIGHTS=[25,30,35,40,42,45,47,48,49,50,51,52,53,55,57,60,62,65,70,75,80];let all=[];try{all=JSON.parse(localStorage.getItem('golfClubs')||'null')||seed}catch(e){all=seed}let main=all.filter(c=>c.status==='MAIN').slice(0,14),activeIndex=-1,calcBase=0;const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function find(db,text){return db.find(v=>v.test.test(text))||{}}function photo(db,text){let x=find(db,text);return x.url||''}function img(url,alt){return url?`<img src="${esc(url)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="missing" style="display:none">写真準備中</span>`:`<span class="missing">写真準備中</span>`}function shortShaft(s=''){return s.replace(/Fujikura|Graphite Design|Mitsubishi Chemical|Nippon Shaft/ig,'').trim()}function render(){document.getElementById('count').textContent=`${main.length} / 14本`;let h='';for(let i=0;i<14;i++){let c=main[i];if(c){let hp=photo(HEAD_PHOTOS,(c.brand||'')+' '+(c.model||'')),sp=photo(SHAFT_PHOTOS,c.shaft||'');h+=`<article class="clubRow" onclick="openDetail(${i})"><div class="photoHalf"><span class="tag">ヘッド</span>${img(hp,c.model)}</div><div class="photoHalf"><span class="tag">シャフト</span>${img(sp,c.shaft)}</div><span class="no">#${i+1}</span><div class="rowInfo"><div class="rowModel">${esc(c.brand)} ${esc(c.model)}</div></div><div class="rowShaft">${esc(shortShaft(c.shaft||''))}</div></article>`}else if(i===13)h+=`<a class="addRow" href="./?add=1">＋ クラブ追加</a>`;else h+=`<div class="empty"><b>＋</b>${i+1}本目</div>`}document.getElementById('rows').innerHTML=h}function box(l,v,e=''){return `<div class="specBox"><div class="label">${l}</div><div class="value">${esc(v||'データ準備中')}</div>${e?`<div class="estimate">${e}</div>`:''}</div>`}function gripOptions(sel){return GRIP_WEIGHTS.map(g=>`<option value="${g}" ${g===sel?'selected':''}>${g}g</option>`).join('')}function updateGrip(v){let g=Number(v),total=calcBase?Math.round(calcBase+g):null;document.getElementById('totalWeight').textContent=total?total+'g':'—';if(activeIndex>=0){main[activeIndex].gripWeight=g;let idx=all.findIndex(x=>x===main[activeIndex]||(x.brand===main[activeIndex].brand&&x.model===main[activeIndex].model&&x.status==='MAIN'));if(idx>=0)all[idx].gripWeight=g;try{localStorage.setItem('golfClubs',JSON.stringify(all))}catch(e){}}}function openDetail(i){activeIndex=i;let c=main[i],key=(c.brand||'')+' '+(c.model||''),hd=find(HEAD_DB,key),sd=find(SHAFT_DB,c.shaft||''),hp=photo(HEAD_PHOTOS,key),sp=photo(SHAFT_PHOTOS,c.shaft||'');let headW=Number(hd.weight)||0,shaftW=Number(sd.weight)||0,adapterW=/ドライバー|FW|フェアウェイ|ユーティリティ/i.test(c.category||'')?8:0,gripW=Number(c.gripWeight)||50;calcBase=headW&&shaftW?headW+shaftW+adapterW:0;let total=calcBase?Math.round(calcBase+gripW):null,length=c.length||hd.length||(/ドライバー/i.test(c.category||'')?45.25:'—');document.getElementById('detailTitle').textContent=key;document.getElementById('detailPhotos').innerHTML=`<div>${img(hp,c.model)}</div><div>${img(sp,c.shaft)}</div>`;document.getElementById('specContent').innerHTML=`<div class="sectionTitle">ヘッド</div><div class="specGrid">${box('発売年',c.year||hd.year?String(c.year||hd.year)+'年':'')}${box('ロフト',c.loft||c.spec||hd.lofts||'')}${box('ヘッド重量',headW?headW+'g':'','標準重量の目安')}</div><div class="sectionTitle">シャフト</div><div class="specGrid">${box('発売年',sd.year?sd.year+'年':'')}${box('シャフト重量',shaftW?shaftW+'g':'')}${box('トルク',sd.torque||'')}${box('調子',sd.kick||'')}</div><div class="sectionTitle">組み上がり目安</div><div class="combo"><div class="comboGrid"><div><div class="label">総重量</div><div class="value" id="totalWeight">${total?total+'g':'—'}</div></div><div><div class="label">クラブ長</div><div class="value">${length!=='—'?length+'″':'—'}</div></div><div><div class="label">グリップ重量</div><select class="gripSelect" onchange="updateGrip(this.value)">${gripOptions(gripW)}</select></div></div><div class="note">グリップはメーカー名ではなく一般的な重量から選択します。軽量・女性向けを想定した25g〜、一般的な50g前後、重量級80gまで選択可能。変更すると総重量をその場で自動再計算します。総重量はヘッド＋シャフト＋グリップ＋スリーブ等の目安です。</div></div>`;document.getElementById('detail').classList.add('open')}function closeDetail(){document.getElementById('detail').classList.remove('open')}render();</script></body></html>
