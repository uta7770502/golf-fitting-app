<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マイバッグ | マイゴルフガレージ</title><style>:root{--bg:#090c0a;--card:#141a16;--line:#29342c;--g:#b9ff4f;--mut:#94a197;--w:#f7f9f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;padding:20px 16px 90px}.back{color:var(--g);text-decoration:none;font-size:13px}.eye{margin-top:18px;font-size:10px;letter-spacing:.14em;color:var(--g);font-weight:800}h1{font-size:34px;margin:5px 0}.mut{color:var(--mut);font-size:12px}.summary{display:flex;justify-content:space-between;align-items:end;margin:20px 0 12px}.summary h2{margin:0;font-size:18px}.count{color:var(--g);font-size:12px;font-weight:800}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{position:relative;min-height:320px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,#182019,#0e130f);padding:12px;overflow:hidden}.clubVisual{height:205px;position:relative}.shaft{position:absolute;left:50%;top:63px;transform:translateX(-50%);width:11px;height:132px;border-radius:5px;background:var(--shaft,#222);box-shadow:inset 2px 0 #ffffff22,inset -2px 0 #0008}.shaft:after{content:attr(data-shaft);position:absolute;left:50%;top:45px;transform:translateX(-50%) rotate(-90deg);width:118px;text-align:center;white-space:nowrap;font-size:7px;font-weight:800;letter-spacing:.03em;color:var(--shaftText,#fff)}.head{position:absolute;left:50%;top:7px;transform:translateX(-50%);filter:drop-shadow(0 7px 7px #0009)}.driver .head{width:92px;height:70px;border-radius:50% 45% 38% 50%;background:linear-gradient(145deg,#070908 10%,#4a554e 55%,#111 80%);border:2px solid #657269}.wood .head{width:76px;height:61px;border-radius:50% 44% 40% 50%;background:linear-gradient(145deg,#0b0e0c,#3c4940);border:2px solid #5f6e64}.iron .head{width:61px;height:72px;border-radius:7px 15px 9px 5px;transform:translateX(-50%) skew(-8deg);background:linear-gradient(135deg,#f0f2f0 5%,#8a948d 48%,#d8dcd9 70%,#5f6962);border:2px solid #c5ccc7}.wedge .head{width:66px;height:68px;border-radius:11px 17px 13px 7px;transform:translateX(-50%) skew(-7deg);background:linear-gradient(135deg,#f1f3f1,#747e77 55%,#d4d9d5);border:2px solid #c9cfcb}.putter .head{top:30px;width:91px;height:25px;border-radius:7px;background:linear-gradient(135deg,#dfe3e0,#69736c);border:2px solid #aeb6b0}.head:after{content:attr(data-brand);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#f4f6f4}.iron .head:after,.wedge .head:after,.putter .head:after{color:#1a201c}.clubNo{position:absolute;right:10px;top:10px;font-size:10px;color:#6f7c73}.category{font-size:9px;color:var(--g);font-weight:900;letter-spacing:.08em}.model{font-size:14px;font-weight:850;line-height:1.15;margin-top:5px;min-height:32px}.spec{font-size:11px;color:#e1e6e2;margin-top:5px}.shaftName{font-size:10px;color:var(--mut);line-height:1.35;margin-top:7px}.emptyCard{min-height:320px;border:1px dashed #263129;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#526057;font-size:11px}.filters{display:flex;gap:7px;overflow:auto;margin:0 0 12px;scrollbar-width:none}.filter{white-space:nowrap;border:1px solid var(--line);background:#111713;color:#9ba69e;border-radius:20px;padding:8px 12px;font-size:11px}.filter.on{background:var(--g);color:#111;border-color:var(--g);font-weight:800}.add{display:block;margin:16px 0 0;text-align:center;background:var(--g);color:#111;text-decoration:none;font-weight:800;padding:14px;border-radius:14px}.note{text-align:center;color:var(--mut);font-size:10px;margin:12px 0 0}@media(max-width:370px){.card{min-height:305px;padding:10px}.clubVisual{height:195px}.model{font-size:12px}}</style></head><body><main class="app"><a class="back" href="./">← ホーム</a><div class="eye">現在のセッティング</div><h1>マイバッグ</h1><div class="mut">ヘッドとシャフトまで見える、自分だけの14本コレクション。</div><div class="summary"><h2>主力クラブ</h2><span id="count" class="count"></span></div><div id="filters" class="filters"></div><div id="cards" class="cards"></div><div class="note">登録したヘッド・シャフト情報をもとに表示しています</div><a class="add" href="./?add=1">＋ クラブを追加</a></main><script>const seed=[{category:'ドライバー',brand:'PING',year:'2025',model:'G440 LST',spec:'10.5°',shaft:'Fujikura 24 VENTUS BLACK 6S',status:'MAIN'}];let all=[];try{all=JSON.parse(localStorage.getItem('golfClubs')||'null')||seed}catch(e){all=seed}let main=all.filter(c=>c.status==='MAIN').slice(0,14),active='すべて';const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function type(c){let s=(c.category||'').toLowerCase();if(s.includes('ドライバー'))return'driver';if(s.includes('フェアウェイ')||s.includes('ユーティリティ')||s.includes('hy'))return'wood';if(s.includes('パター'))return'putter';if(s.includes('ウェッジ'))return'wedge';return'iron'}function group(c){return({driver:'ドライバー',wood:'FW・UT',iron:'アイアン',wedge:'ウェッジ',putter:'パター'})[type(c)]}function brandMark(c){let b=(c.brand||'').toUpperCase();if(b.includes('PING'))return'PING';if(b.includes('TITLEIST'))return'TITLEIST';if(b.includes('CALLAWAY'))return'CALLAWAY';if(b.includes('TAYLOR'))return'TM';if(b.includes('SRIXON'))return'SRIXON';if(b.includes('MIZUNO'))return'MIZUNO';if(b.includes('LAB')||b.includes('L.A.B'))return'L.A.B.';return(c.brand||'CLUB').slice(0,9).toUpperCase()}function shaftStyle(c){let s=(c.shaft||'').toUpperCase();if(s.includes('VENTUS BLACK'))return['#111613','#fff','VENTUS BLACK'];if(s.includes('VENTUS BLUE'))return['#164a79','#fff','VENTUS BLUE'];if(s.includes('VENTUS RED'))return['#8d2727','#fff','VENTUS RED'];if(s.includes('TOUR AD'))return['#e7e9e7','#111','TOUR AD'];if(s.includes('DIAMANA'))return['#1e2b38','#fff','DIAMANA'];if(s.includes('TENSEI'))return['#c9d0cb','#111','TENSEI'];if(s.includes('SPEEDER'))return['#254f77','#fff','SPEEDER'];if(s.includes('MODUS'))return['#b5b9b6','#111','MODUS'];if(s.includes('DYNAMIC GOLD'))return['#c8cbc9','#111','DG'];return['#3c4640','#fff',(c.shaft||'SHAFT').split(' ').slice(0,2).join(' ')]}function groups(){let a=['すべて'];main.forEach(c=>{let g=group(c);if(!a.includes(g))a.push(g)});return a}function setFilter(g){active=g;render()}function render(){document.getElementById('count').textContent=`${main.length} / 14本`;document.getElementById('filters').innerHTML=groups().map(g=>`<button class="filter ${active===g?'on':''}" onclick="setFilter('${g}')">${g}</button>`).join('');let shown=active==='すべて'?main:main.filter(c=>group(c)===active);let html=shown.map((c,i)=>{let sh=shaftStyle(c);return `<div class="card ${type(c)}"><span class="clubNo">#${main.indexOf(c)+1}</span><div class="clubVisual"><div class="shaft" style="--shaft:${sh[0]};--shaftText:${sh[1]}" data-shaft="${esc(sh[2])}"></div><div class="head" data-brand="${esc(brandMark(c))}"></div></div><div class="category">${esc(group(c))}</div><div class="model">${esc(c.brand)}<br>${esc(c.model)}</div><div class="spec">${esc(c.spec||'スペック未登録')}</div><div class="shaftName">${esc(c.shaft||'シャフト未登録')}</div></div>`}).join('');if(active==='すべて')for(let i=main.length;i<14;i++)html+=`<div class="emptyCard">EMPTY ${i+1}</div>`;document.getElementById('cards').innerHTML=html||'<div class="emptyCard">クラブを登録してください</div>'}render();</script></body></html>
