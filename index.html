<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MY GOLF GARAGE</title><style>:root{--bg:#090c0a;--card:#141a16;--line:#29342c;--g:#b9ff4f;--mut:#94a197;--w:#f7f9f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;padding:24px 18px 118px}.eye{font-size:10px;letter-spacing:.18em;color:var(--g);font-weight:800}h1{font-size:30px;margin:6px 0 3px}h2{font-size:15px;margin:0 0 14px}.mut{color:var(--mut);font-size:12px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.hero{margin-top:22px}.big{font-size:40px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:11px 0 25px}.tile{min-height:122px;text-align:left;color:inherit}.tile b{display:block;font-size:16px;margin:11px 0 4px}.green{background:var(--g);color:#111;border:0}.green .mut{color:#455729}.section{margin:28px 0}.club{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.pill{font-size:10px;color:var(--g);border:1px solid #445348;border-radius:20px;padding:5px 8px;height:max-content}.btn{width:100%;border:0;border-radius:14px;background:var(--g);color:#111;padding:14px;font-weight:800;margin-top:12px;text-decoration:none;display:block;text-align:center}.label{font-size:11px;color:var(--mut);margin:13px 0 5px}.nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#0d110fee;border-top:1px solid var(--line);display:flex;justify-content:center}.navin{max-width:520px;width:100%;display:flex;justify-content:space-around;align-items:center;font-size:10px;color:var(--mut)}button{font:inherit;cursor:pointer}.driver{border-left:3px solid var(--g);margin-top:12px}.driver b{font-size:17px}.tag{display:inline-block;border:1px solid #445348;border-radius:20px;padding:4px 7px;font-size:10px;color:var(--g);margin-top:8px}</style></head><body><main class="app"><div class="eye">PERSONAL CLUB & FITTING</div><h1>MY GOLF GARAGE</h1><div class="mut">クラブを集める。測る。自分だけの最適解をつくる。</div><div class="hero"><div class="mut">MY BAG</div><span class="big" id="bagCount">0</span> <span class="mut">/ 14 CLUBS</span><div class="mut">現在のセッティングをAIがチェック</div></div><div class="grid"><button class="card tile" onclick="location.href='./?garage=1'">♢<b>MY GARAGE</b><span class="mut">所有クラブを登録・管理</span></button><button class="card tile green" onclick="startFitting()">◎<b>AI FITTING</b><span class="mut">ドライバーを実測フィッティング</span></button><button class="card tile" onclick="location.href='./?bag=1'">↔<b>BAG CHECK</b><span class="mut">距離ギャップを解析</span></button><button class="card tile" onclick="location.href='./?add=1'">＋<b>ADD CLUB</b><span class="mut">歴代モデルから追加</span></button></div><h2>CURRENT DRIVER</h2><div id="driverCard"></div><h2 style="margin-top:28px">MAIN BAG</h2><div id="bagList"></div></main><div class="nav"><div class="navin"><span>HOME</span><span>GARAGE</span><span onclick="startFitting()">FITTING</span><span>MY BAG</span></div></div><script>const seed=[{category:'ドライバー',brand:'PING',year:'2025',model:'G440 LST',spec:'10.5°',shaft:'Fujikura 24 VENTUS BLACK 6S',status:'MAIN',carry:null}];let clubs=JSON.parse(localStorage.getItem('golfClubs')||'null')||seed;function driver(){return clubs.find(c=>c.status==='MAIN'&&(c.category==='ドライバー'||!c.category))||clubs.find(c=>c.category==='ドライバー')}function startFitting(){let d=driver();if(d)localStorage.setItem('fittingCurrentDriver',JSON.stringify(d));location.href='driver-fitting.html'}function render(){let main=clubs.filter(c=>c.status==='MAIN'),d=driver();document.getElementById('bagCount').textContent=main.length;document.getElementById('driverCard').innerHTML=d?`<div class="card driver"><b>${d.brand} ${d.model}</b><div class="mut">${d.year||''} · ${d.spec||d.loft||'ロフト不明'}<br>${d.shaft||'シャフト未登録'}</div><span class="tag">CURRENT</span><a class="btn" href="javascript:startFitting()">このドライバーをフィッティング</a></div>`:`<div class="card"><div class="mut">MAIN BAGにドライバーを登録すると自動で読み込みます。</div><a class="btn" href="./?add=1">ドライバーを登録</a></div>`;document.getElementById('bagList').innerHTML=main.map(c=>`<div class="club"><div><b>${c.brand} ${c.model}</b><div class="mut">${c.category||'ドライバー'} · ${c.spec||c.loft||''}${c.carry?' · '+c.carry+'yd':''}${c.shaft?' · '+c.shaft:''}</div></div><span class="pill">${c.category==='ドライバー'?'FITTING':'MAIN'}</span></div>`).join('')||'<div class="mut">まだ登録がありません</div>'}render();</script></body></html>
